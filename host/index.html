<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Observatory</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000;
  --ink: #e9e5dc;
  --ink-2: #8f8c84;
  --ink-3: #4b4a45;
  --amber: #f0b45a;
  --ice: #9fd3ff;
  --rose: #ff7a6b;
  --up: #9fe0b0;
}
html.light {
  --bg: #f1efe9;
  --ink: #1d1c1a;
  --ink-2: #6b6964;
  --ink-3: #a9a69f;
  --amber: #b8791f;
  --ice: #1f6fb2;
  --rose: #c8442f;
  --up: #2f8a4a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; cursor: none; transition: background 25s linear; }
#drift * { transition: color 25s linear; }
body {
  font-family: "IBM Plex Sans", system-ui, sans-serif;
  font-weight: 300;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
#stage { position: absolute; inset: 0; }
#globe { position: absolute; display: block; }
#lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.layer { position: absolute; inset: 0; pointer-events: none; }

/* ---------- top band ---------- */
#clock { position: absolute; left: 4vw; top: 4.2vh; line-height: 1; }
#clock .t { font-size: 7.2vh; font-weight: 300; letter-spacing: -0.02em; }
#clock .t small { font-size: 3vh; color: var(--ink-2); margin-left: 0.6vh; }
#clock .d { font-size: 2.1vh; color: var(--ink-2); margin-top: 1.4vh; }

#wx { position: absolute; right: 4vw; top: 4.2vh; text-align: right; line-height: 1.2; }
#wx .temp { font-size: 5.2vh; font-weight: 300; letter-spacing: -0.02em; }
#wx .temp span { font-size: 2.4vh; color: var(--ink-2); vertical-align: top; }
#wx .cond { font-size: 2vh; color: var(--ink-2); }
#wx .sun { font-size: 1.7vh; color: var(--ink-3); margin-top: 0.8vh; }
#wx .sun b { color: var(--ink-2); font-weight: 400; }

/* ---------- stats column ---------- */
#stats { position: absolute; left: 4vw; top: 23vh; width: 25vw; max-height: 64vh; overflow: hidden; }
.stat { margin-bottom: 2.7vh; line-height: 1.05; }
.stat .v { font-size: 3.9vh; font-weight: 300; letter-spacing: -0.02em; white-space: nowrap; }
.stat .v span { font-size: 2vh; color: var(--ink-2); margin-left: 0.5vh; letter-spacing: 0; }
.stat .l { font-size: 1.7vh; color: var(--ink-2); margin-top: 0.8vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .l em { font-style: normal; color: var(--ink-3); }
.stat.live .v { color: var(--ice); }
.stat.est .v { color: var(--ink); }
.stat.up .v { color: var(--up); } .stat.down .v { color: var(--rose); }
/* seven or eight stats: tighten so the column still fits above the ticker */
#stats.dense .stat { margin-bottom: 1.6vh; }
#stats.dense .stat .v { font-size: 3.3vh; }
#stats.dense .stat .l { margin-top: 0.5vh; }

/* ---------- headlines ---------- */
.headline {
  position: absolute; width: 21vw; max-width: 420px;
  transform: translate(0, -50%);
  opacity: 0; transition: opacity 900ms ease;
  will-change: opacity;
}
.headline.on { opacity: 1; }
.headline .h { font-size: 2vh; font-weight: 400; line-height: 1.32; color: var(--ink); }
.headline .m { font-size: 1.5vh; color: var(--amber); margin-top: 0.7vh; }
.headline .h, .headline .m { transition: opacity 900ms ease, color 25s linear; }
.headline .m span { color: var(--ink-3); }
.headline.left { text-align: right; }

/* ---------- ticker + footer ---------- */
#ticker { position: absolute; left: 4vw; right: 4vw; bottom: 5.4vh; height: 3vh; overflow: hidden; }
#ticker .row { position: absolute; left: 0; right: 0; font-size: 2vh; color: var(--ink-2); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity 800ms ease; }
#ticker .row.on { opacity: 1; }
#ticker .row b { font-weight: 400; color: var(--ink); }
#foot { position: absolute; left: 4vw; bottom: 2.4vh; font-size: 1.4vh; color: var(--ink-3); }
#foot span { margin-right: 2vw; }
#qr { position: absolute; right: 4vw; bottom: 2.4vh; display: flex; align-items: flex-end; gap: 1vw; opacity: 0.55; }
#qr img { width: 8.5vh; height: 8.5vh; filter: invert(1) brightness(0.9); mix-blend-mode: screen; }
html.light #qr img { filter: none; mix-blend-mode: multiply; }
#qr .cap { font-size: 1.4vh; color: var(--ink-3); line-height: 1.3; text-align: right; }

/* burn-in guard: the whole overlay drifts by a few px on a long cycle */
#drift { position: absolute; inset: 0; animation: drift 900s ease-in-out infinite alternate; }
@keyframes drift { from { transform: translate(0,0);} to { transform: translate(6px,4px);} }
@media (prefers-reduced-motion: reduce) { #drift { animation: none; } }
</style>
</head>
<body>
<div id="stage"><canvas id="globe"></canvas></div>
<div id="drift">
<svg id="lines"></svg>
  <div class="layer" id="cards"></div>
  <div class="layer">
    <div id="clock"><div class="t">--:--</div><div class="d"></div></div>
    <div id="wx"><div class="temp">—</div><div class="cond"></div><div class="sun"></div></div>
    <div id="stats"></div>
    <div id="ticker"></div>
    <div id="foot"></div>
    <div id="qr"></div>
  </div>
</div>

<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script src="settings.js"></script>
<script>
// =====================================================================
//  CONFIG
// =====================================================================
const CFG = {
  home: { name: "Gatineau", lat: 45.48, lon: -75.65, tz: "America/Toronto" },
  dataUrl: "data/data.json",
  remoteUrl: "https://mitchyc24.github.io/host/remote.html",
  rotationPeriodSec: 300,      // one full turn
  fpsCap: 30,
  headlineEverySec: 22,
  headlineHoldSec: 34,
  maxHeadlines: 3,
  tickerEverySec: 12,
  reloadEveryMin: 12 * 60,
  dataEveryMin: 15,
  wikiStream: true,
  geoBelt: true,
  autoTheme: true,             // light during the day, dark from dusk to dawn (home sunrise/sunset)
  twilightMin: 35,             // switch this many minutes after sunrise / before sunset
};
const DEV = /[?&]dev/.test(location.search);

// =====================================================================
//  SETTINGS  (chosen on the phone in remote.html; see settings.js)
// =====================================================================
// Kept in this device's localStorage so the TV comes back the way it was left.
// In a desktop preview (?dev) that storage is shared with remote.html, so the
// preview follows the controls live through the "storage" event.
let { settings: SET, stored: SET_STORED } = OBS.load();
let LOCALE = OBS.LANGS[SET.lang].locale;
const T = (key, vars) => OBS.t(SET.lang, key, vars);
document.documentElement.lang = SET.lang;

function applySettings(raw, from) {
  SET = OBS.normalize(raw);
  SET_STORED = true;
  LOCALE = OBS.LANGS[SET.lang].locale;
  document.documentElement.lang = SET.lang;
  if (from !== "storage") OBS.save(SET);
  S.shown.clear();
  rebuildNews();
  renderStats(); renderWeather(); renderFoot(); renderClock(); renderQR(); updateTheme();
  castSend();                     // every connected phone sees the new state
}
addEventListener("storage", (e) => {
  if (e.key !== OBS.KEY || !e.newValue) return;
  try { applySettings(JSON.parse(e.newValue), "storage"); } catch (err) { console.warn("settings", err); }
});

// =====================================================================
//  CAST
// =====================================================================
// Phones talk to the TV on a custom channel: {type:"hello"} asks for the current
// state, {type:"settings"} replaces it. The TV answers with {type:"state"}.
let castCtx = null;
if (!DEV && window.cast && cast.framework) {
  try {
    castCtx = cast.framework.CastReceiverContext.getInstance();
    castCtx.addCustomMessageListener(OBS.NS, (ev) => {
      const m = ev.data || {};
      if (m.type === "settings") applySettings(m.settings, "cast");
      else if (m.type === "hello") castSend(ev.senderId);
    });
    const opts = new cast.framework.CastReceiverOptions();
    opts.disableIdleTimeout = true;
    opts.customNamespaces = { [OBS.NS]: cast.framework.system.MessageType.JSON };
    castCtx.start(opts);
  } catch (e) { console.warn("cast init", e); castCtx = null; }
}
function castSend(senderId) {    // no senderId: broadcast to every connected phone
  if (!castCtx) return;
  try { castCtx.sendCustomMessage(OBS.NS, senderId, { type: "state", settings: SET, stored: SET_STORED }); }
  catch (e) { console.warn("cast send", e); }
}

// =====================================================================
//  HELPERS
// =====================================================================
const $ = (s) => document.querySelector(s);
const fmt = (n, d = 0) => new Intl.NumberFormat(LOCALE, { maximumFractionDigits: d, minimumFractionDigits: d }).format(n);
const pct = (v, d = 1) => new Intl.NumberFormat(LOCALE, { style: "percent", signDisplay: "always", maximumFractionDigits: d }).format(v / 100);
const cap = (s) => s ? s.charAt(0).toLocaleUpperCase(LOCALE) + s.slice(1) : s;
const mins = (t) => parseInt(t.slice(11, 13)) * 60 + parseInt(t.slice(14, 16));   // "YYYY-MM-DDTHH:MM" -> minutes
const rad = Math.PI / 180;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function latLonToVec(lat, lon, r = 1) {
  const phi = (90 - lat) * rad, th = (lon + 180) * rad;
  return new THREE.Vector3(-r * Math.sin(phi) * Math.cos(th), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(th));
}
async function fetchJSON(url, ms = 15000) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, { signal: c.signal, cache: "no-store" }); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
const esc = (t) => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function agoMin(iso) { return Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000)); }

// Subsolar point (declination + equation of time, accurate to ~0.3°)
function subsolar(date) {
  const jd = date.getTime() / 86400000 + 2440587.5, n = jd - 2451545.0;
  const L = (280.460 + 0.9856474 * n) % 360, g = ((357.528 + 0.9856003 * n) % 360) * rad;
  const lam = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad;
  const eps = (23.439 - 0.0000004 * n) * rad;
  const dec = Math.asin(Math.sin(eps) * Math.sin(lam));
  let ra = Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam)); if (ra < 0) ra += 2 * Math.PI;
  const gmst = ((18.697374558 + 24.06570982441908 * n) % 24) * 15 * rad;
  let lon = (ra - gmst) / rad; lon = ((lon + 540) % 360) - 180;
  return { lat: dec / rad, lon };
}

// =====================================================================
//  SCENE
// =====================================================================
const canvas = $("#globe");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "low-power" });
renderer.setPixelRatio(1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 50);
camera.position.set(0, 0, 3.9);
const tilt = new THREE.Group();
tilt.rotation.z = -0.18;             // a gentle lean, purely for composition
const globe = new THREE.Group();     // spins about the tilted axis
tilt.add(globe); scene.add(tilt);

const loader = new THREE.TextureLoader();
const texDay = loader.load("assets/earth_day_2k.jpg");
const texNight = loader.load("assets/earth_night_2k.png");
texDay.anisotropy = 4; texNight.anisotropy = 4;

const earthMat = new THREE.ShaderMaterial({
  uniforms: { day: { value: texDay }, night: { value: texNight }, sunDir: { value: new THREE.Vector3(1, 0, 0) } },
  vertexShader: `
    varying vec2 vUv; varying vec3 vN;
    void main(){ vUv = uv; vN = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D day, night; uniform vec3 sunDir;
    varying vec2 vUv; varying vec3 vN;
    void main(){
      float d = dot(normalize(vN), normalize(sunDir));
      float t = smoothstep(-0.10, 0.22, d);
      vec3 dc = texture2D(day, vUv).rgb;
      vec3 nc = texture2D(night, vUv).rgb;
      nc = nc * vec3(1.15, 0.92, 0.62) * 1.35 + vec3(0.012, 0.016, 0.030);
      dc = dc * (0.22 + 0.95 * clamp(d, 0.0, 1.0));
      vec3 c = mix(nc, dc, t);
      gl_FragColor = vec4(c, 1.0); }`
});
const earth = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 48), earthMat);
globe.add(earth);

// atmosphere rim (back-face fresnel, additive)
const atmo = new THREE.Mesh(new THREE.SphereGeometry(1.035, 48, 32), new THREE.ShaderMaterial({
  uniforms: { sunDir: { value: earthMat.uniforms.sunDir.value } },
  vertexShader: `varying vec3 vN; varying vec3 vP; void main(){ vN = normalize(mat3(modelMatrix)*normal); vP=(modelMatrix*vec4(position,1.0)).xyz;
    gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader: `uniform vec3 sunDir; varying vec3 vN; varying vec3 vP;
    void main(){ vec3 v = normalize(cameraPosition - vP); float f = pow(1.0 - abs(dot(v, vN)), 3.0);
      float s = 0.35 + 0.65*clamp(dot(vN, normalize(sunDir))*0.8+0.4, 0.0, 1.0);
      gl_FragColor = vec4(vec3(0.35,0.62,1.0)*f*s, f*s*0.9); }`,
  transparent: true, blending: THREE.AdditiveBlending, side: THREE.BackSide, depthWrite: false
}));
globe.add(atmo);

// marker layers
const layerQuakes = new THREE.Group(), layerBelt = new THREE.Group(), layerFlick = new THREE.Group(), layerPins = new THREE.Group();
globe.add(layerQuakes, layerBelt, layerFlick, layerPins);

// ISS: true-scale altitude, small bright point + short trail
const issMat = new THREE.MeshBasicMaterial({ color: 0x9fd3ff });
const iss = new THREE.Mesh(new THREE.SphereGeometry(0.012, 8, 8), issMat);
iss.visible = false; globe.add(iss);
const trailPts = new Array(90).fill(0).map(() => new THREE.Vector3());
const trailGeo = new THREE.BufferGeometry().setFromPoints(trailPts);
const trail = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({ color: 0x9fd3ff, transparent: true, opacity: 0.35 }));
trail.visible = false; globe.add(trail);
let trailCount = 0;

// home marker
{
  const m = new THREE.Mesh(new THREE.RingGeometry(0.012, 0.018, 24), new THREE.MeshBasicMaterial({ color: 0xf0b45a, side: THREE.DoubleSide }));
  const p = latLonToVec(CFG.home.lat, CFG.home.lon, 1.003); m.position.copy(p); m.lookAt(p.clone().multiplyScalar(2)); layerPins.add(m);
}

// flicker pool (wikipedia edits)
const flickPool = [];
const flickMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 });
for (let i = 0; i < 24; i++) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(0.006, 8), flickMat.clone()); m.visible = false; m.userData.t = 0;
  layerFlick.add(m); flickPool.push(m);
}
function flick(lat, lon) {
  const m = flickPool.find(x => !x.visible) || flickPool[Math.floor(Math.random() * flickPool.length)];
  const p = latLonToVec(lat + (Math.random() - 0.5) * 6, lon + (Math.random() - 0.5) * 8, 1.004);
  m.position.copy(p); m.lookAt(p.clone().multiplyScalar(2)); m.visible = true; m.userData.t = performance.now();
}

// layout: square canvas, centred at 63% of width
let size = 0, canvasLeft = 0, canvasTop = 0;
function layout() {
  const W = innerWidth, H = innerHeight;
  size = Math.round(H * 0.98);
  canvasLeft = Math.round(W * 0.64 - size / 2); canvasTop = Math.round((H - size) / 2);
  canvas.style.left = canvasLeft + "px"; canvas.style.top = canvasTop + "px";
  canvas.style.width = canvas.style.height = size + "px";
  renderer.setSize(size, size, false);
  camera.aspect = 1; camera.updateProjectionMatrix();
}
addEventListener("resize", layout); layout();

// =====================================================================
//  STATE
// =====================================================================
const S = {
  data: null, weather: null, air: null, iss: null, quakes: [], kp: null, wind: null,
  pools: { world: [], local: [] },   // headlines that pass the news settings, split by scope
  used: new Set(), shown: new Map(), // items already on screen; cards shown per source
  cards: [], tickerItems: [], tickerI: 0,
};

// =====================================================================
//  LIVE FEEDS (client-side, CORS-friendly, keyless)
// =====================================================================
async function pollISS() {
  try {
    const j = await fetchJSON("https://api.wheretheiss.at/v1/satellites/25544", 8000);
    S.iss = j;
    const p = latLonToVec(j.latitude, j.longitude, 1 + j.altitude / 6371);
    iss.position.copy(p); iss.visible = true;
    trailPts.push(trailPts.shift().copy(p)); trailCount = Math.min(trailCount + 1, trailPts.length);
    const arr = trailGeo.attributes.position.array;
    for (let i = 0; i < trailPts.length; i++) { const q = trailPts[i]; arr[i * 3] = q.x; arr[i * 3 + 1] = q.y; arr[i * 3 + 2] = q.z; }
    trailGeo.attributes.position.needsUpdate = true;
    trailGeo.setDrawRange(trailPts.length - trailCount, trailCount);
    trail.visible = trailCount > 2;
  } catch (e) { /* keep last */ }
}
async function pollQuakes() {
  try {
    const j = await fetchJSON("https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson");
    S.quakes = j.features.map(f => ({ mag: f.properties.mag, place: f.properties.place, t: f.properties.time,
      lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0] })).filter(q => q.mag != null);
    while (layerQuakes.children.length) { const c = layerQuakes.children.pop(); c.geometry.dispose(); c.material.dispose(); }
    for (const q of S.quakes.slice(0, 60)) {
      const r = 0.006 + Math.max(0, q.mag - 2.5) * 0.012;
      const age = (Date.now() - q.t) / 86400000;  // 0..1
      const m = new THREE.Mesh(new THREE.RingGeometry(r * 0.65, r, 24),
        new THREE.MeshBasicMaterial({ color: 0xff7a6b, transparent: true, opacity: 0.85 - age * 0.55, side: THREE.DoubleSide, depthWrite: false }));
      const p = latLonToVec(q.lat, q.lon, 1.004); m.position.copy(p); m.lookAt(p.clone().multiplyScalar(2)); layerQuakes.add(m);
    }
  } catch (e) { /* keep last */ }
}
async function pollSpaceWeather() {
  try {
    const k = await fetchJSON("https://services.swpc.noaa.gov/json/planetary_k_index_1m.json");
    for (let i = k.length - 1; i >= 0; i--) { const v = parseFloat(k[i].kp_index ?? k[i].estimated_kp); if (Number.isFinite(v)) { S.kp = v; break; } }
  } catch (e) {
    try {
      const k = await fetchJSON("https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json");
      for (let i = k.length - 1; i > 0; i--) { const v = parseFloat(k[i][1]); if (Number.isFinite(v)) { S.kp = v; break; } }
    } catch (e2) { }
  }
  try {
    const w = await fetchJSON("https://services.swpc.noaa.gov/products/solar-wind/plasma-5-minute.json");
    for (let i = w.length - 1; i > 0; i--) { const sp = parseFloat(w[i][2]); if (Number.isFinite(sp)) { S.wind = { speed: sp, density: parseFloat(w[i][1]) }; break; } }
  } catch (e) { }
}
async function pollWeather() {
  try {
    // past_days=1 adds yesterday (index 0) so the daylight stat can show the change; today is the last entry
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${CFG.home.lat}&longitude=${CFG.home.lon}` +
      `&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset` +
      `&timezone=${encodeURIComponent(CFG.home.tz)}&past_days=1&forecast_days=1`;
    S.weather = await fetchJSON(u);
    renderWeather(); updateTheme();
  } catch (e) { }
}
async function pollAir() {
  try {
    const u = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${CFG.home.lat}&longitude=${CFG.home.lon}` +
      `&current=us_aqi,pm2_5&timezone=${encodeURIComponent(CFG.home.tz)}`;
    S.air = (await fetchJSON(u)).current;
  } catch (e) { }
}
const WMO = { 0: "clear", 1: "mostlyclear", 2: "partly", 3: "overcast", 45: "fog", 48: "rimefog", 51: "drizzle1", 53: "drizzle", 55: "drizzle3",
  56: "fdrizzle", 57: "fdrizzle", 61: "rain1", 63: "rain", 65: "rain3", 66: "frain", 67: "frain", 71: "snow1", 73: "snow", 75: "snow3", 77: "grains",
  80: "showers", 81: "showers", 82: "showers3", 85: "snowshowers", 86: "snowshowers", 95: "storm", 96: "hail", 99: "hail" };
function renderWeather() {
  const w = S.weather; if (!w) return;
  const c = w.current, d = w.daily, i = d.time.length - 1;
  $("#wx .temp").innerHTML = `${Math.round(c.temperature_2m)}<span>°C</span>`;
  $("#wx .cond").textContent = T("wx.line", {
    cond: WMO[c.weather_code] ? cap(T("wx." + WMO[c.weather_code])) : "—", feels: Math.round(c.apparent_temperature),
    min: Math.round(d.temperature_2m_min[i]), max: Math.round(d.temperature_2m_max[i]), wind: Math.round(c.wind_speed_10m) });
  const hm = (s) => s.slice(11, 16);
  $("#wx .sun").innerHTML = `${esc(CFG.home.name)} &nbsp; ${T("wx.sunrise")} <b>${hm(d.sunrise[i])}</b> &nbsp; ${T("wx.sunset")} <b>${hm(d.sunset[i])}</b>`;
}

// Wikipedia edits by language → home region of that language. Texture, not data.
const WIKI = {
  en: [[39.8, -98.6], [54, -2], [-25, 134], [56, -106], [20.6, 79]], de: [[51.2, 10.5]], fr: [[46.2, 2.2], [45.5, -73.6]], es: [[40.5, -3.7], [23.6, -102.6], [-38, -63]],
  ja: [[36.2, 138.3]], zh: [[35.9, 104.2], [23.7, 121]], ru: [[61.5, 105.3]], it: [[41.9, 12.6]], pt: [[-14.2, -51.9], [39.4, -8.2]], ar: [[26.8, 30.8], [23.9, 45.1]],
  ko: [[35.9, 127.8]], nl: [[52.1, 5.3]], pl: [[51.9, 19.1]], sv: [[60.1, 18.6]], tr: [[38.9, 35.2]], fa: [[32.4, 53.7]], uk: [[48.4, 31.2]], he: [[31, 34.9]],
  id: [[-0.8, 113.9]], vi: [[14.1, 108.3]], hi: [[20.6, 79]], cs: [[49.8, 15.5]], fi: [[61.9, 25.7]], no: [[60.5, 8.5]], hu: [[47.2, 19.5]], th: [[15.9, 100.9]],

let lastFlick = 0;

      const lang = d.wiki.slice(0, -4), spots = WIKI[lang]; if (!spots) return;
      const s = spots[Math.floor(Math.random() * spots.length)]; flick(s[0], s[1]); lastFlick = now;
    };

  } catch (e) { }
}

// Split headlines into world and local pools, keeping only enabled sources in the chosen
// languages. Items from an older data.json (no src/lang) count as English world news.
function rebuildNews() {
  const news = S.data && S.data.news, items = (news && news.items) || [];
  const meta = new Map(((news && news.sources) || []).map((src) => [src.id, src]));
  const scope = OBS.regionScope(SET.news.region);
  const world = [], local = [];
  for (const it of items) {
    it.src = it.src || (it.kind === "gdelt" ? "gdelt" : String(it.source || "").toLowerCase().replace(/[^a-z0-9]+/g, "-"));
    if (!OBS.sourceOn(SET, meta.get(it.src) || { id: it.src })) continue;
    if (!SET.news.langs.includes(it.lang || "en")) continue;
    if (!it.region) world.push(it);
    else if (scope.includes(it.region)) local.push(it);
  }
  S.pools = { world, local };
  S.used.clear();
  buildTicker();
}
const localShare = () => (SET.news.region && S.pools.local.length ? SET.news.local : 0);

const svg = $("#lines"), cards = $("#cards");
const camDir = new THREE.Vector3();

function pickHeadline() {
  if (S.cards.length >= CFG.maxHeadlines) return;
  const { world, local } = S.pools;
  const order = Math.random() * 100 < localShare() ? [local, world] : [world, local];
  for (const pool of order) if (pool.length && pickFrom(pool)) return;
}
// Candidates: placed on the globe, unused, on the near hemisphere, not crowding a card
// already up. The outlet that has had the fewest cards goes next, so no source dominates.
function pickFrom(pool) {
  const bySrc = new Map();
  for (const h of pool) {
    if (h.lat == null || h.lon == null || S.used.has(h)) continue;
    const f = facing(h); if (f < 0.45) continue;
    if (S.cards.some(c => Math.abs(c.h.lat - h.lat) < 14 && Math.abs(c.h.lon - h.lon) < 18)) continue;
    if (!bySrc.has(h.src)) bySrc.set(h.src, []);
    bySrc.get(h.src).push([h, f]);
  }
  if (!bySrc.size) {
    const placed = pool.filter(h => h.lat != null), used = placed.filter(h => S.used.has(h)).length;
    if (placed.length && used >= placed.length * 0.8) for (const h of placed) S.used.delete(h);
    return false;
  }
  let src = null, least = Infinity;
  for (const k of bySrc.keys()) { const n = (S.shown.get(k) || 0) + Math.random() * 0.5; if (n < least) { least = n; src = k; } }
  let h = null, best = -1;
  for (const [cand, f] of bySrc.get(src)) { const score = f + Math.random() * 0.4; if (score > best) { best = score; h = cand; } }
  S.used.add(h); S.shown.set(src, (S.shown.get(src) || 0) + 1);
  showCard(h);

}
function showCard(h) {
  const el = document.createElement("div"); el.className = "headline";
  el.innerHTML = `<div class="h">${esc(h.title)}</div><div class="m">${esc(h.source)}${h.place ? ` <span>· ${esc(h.place)}</span>` : ""}</div>`;
  cards.appendChild(el);

  line.setAttribute("fill", "none"); line.style.stroke = "var(--amber)"; line.style.opacity = 0.6; line.setAttribute("stroke-width", "1"); svg.appendChild(line);
  const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  dot.setAttribute("r", "3"); dot.style.fill = "var(--amber)"; svg.appendChild(dot);
  const c = { h, el, line, dot, born: performance.now(), side: h.lon > 0 ? "right" : "left" };
  S.cards.push(c);
  requestAnimationFrame(() => el.classList.add("on"));
  setTimeout(() => { el.classList.remove("on"); line.style.opacity = 0; dot.style.opacity = 0; line.style.transition = dot.style.transition = "opacity 900ms"; }, CFG.headlineHoldSec * 1000);

const tmpV = new THREE.Vector3();
function placeCards() {
  const W = innerWidth, H = innerHeight, cx = W * 0.64, gap = 0.035 * W;
  const yMin = H * 0.22, yMax = H * 0.80, pad = H * 0.025;
  const sides = { left: [], right: [] };
  for (const c of S.cards) {
    tmpV.copy(latLonToVec(c.h.lat, c.h.lon, 1.002)).applyMatrix4(globe.matrixWorld);
    const n = tmpV.clone().normalize(), toCam = camera.position.clone().sub(tmpV).normalize();
    const f = n.dot(toCam);

    c.hide = f < 0.08;

    if (c.hide) continue;

    if (!c.sideLocked) { c.right = c.ax > cx; c.sideLocked = true; }
    c.hh = c.el.offsetHeight / 2; c.cw = c.el.offsetWidth;
    c.y = clamp(c.ay, yMin + c.hh, yMax - c.hh);

  }

  for (const list of [sides.left, sides.right]) {
    list.sort((a, b) => a.ay - b.ay);

      const a = list[i - 1], b = list[i], need = a.hh + b.hh + pad;
      if (b.y - a.y < need) b.y = a.y + need;
    }
    for (let i = list.length - 1; i >= 0; i--) {
      const b = list[i];

      if (i > 0) { const a = list[i - 1], need = a.hh + b.hh + pad; if (b.y - a.y < need) a.y = b.y - need; }
    }

      c.el.classList.toggle("left", !c.right);

}

//  TICKER / FOOT / CLOCK / QR
// =====================================================================
// The ticker weaves news and "on this day": two headlines, then one event. Headlines are
// taken one source at a time (newest first) and local ones are spread through at the chosen share.
function roundRobin(items, n) {
  const bySrc = new Map();
  for (const it of [...items].sort((a, b) => String(b.ts || "").localeCompare(String(a.ts || "")))) {
    if (!bySrc.has(it.src)) bySrc.set(it.src, []);
    bySrc.get(it.src).push(it);
  }
  const lists = [...bySrc.values()].sort(() => Math.random() - 0.5), out = [];
  while (out.length < n && lists.some(l => l.length)) for (const l of lists) if (l.length && out.length < n) out.push(l.shift());
  return out;
}
function onThisDay() {
  const o = S.data && S.data.onthisday; if (!o) return [];
  const ev = (o.by_lang && (o.by_lang[SET.lang] || o.by_lang.en)) || o.events || [];
  return ev.map(e => `<b>${esc(e.year)}</b> ${esc(e.text)}`).sort(() => Math.random() - 0.5).slice(0, 10);
}
function buildTicker() {
  const total = 24, share = localShare();
  const L = roundRobin(S.pools.local, Math.round(total * share / 100)), W = roundRobin(S.pools.world, total - L.length);
  const news = [];
  for (let a = 0, b = 0; a < W.length || b < L.length;) {
    const takeLocal = b < L.length && (a >= W.length || (b + 0.5) / L.length <= (a + 0.5) / W.length);
    news.push(takeLocal ? L[b++] : W[a++]);
  }
  const heads = news.map(n => `<b>${esc(n.source)}</b> ${esc(n.title)}`), days = onThisDay(), items = [];
  while (heads.length || days.length) {
    items.push(...heads.splice(0, 2));
    if (days.length) items.push(days.shift());
  }

}
let tickerRow = null;
function nextTicker() {
  if (!S.tickerItems.length) return;
  const html = S.tickerItems[S.tickerI++ % S.tickerItems.length];
  const row = document.createElement("div"); row.className = "row"; row.innerHTML = html;
  const t = $("#ticker"); t.appendChild(row);
  if (tickerRow) { const old = tickerRow; old.classList.remove("on"); setTimeout(() => old.remove(), 900); }
  tickerRow = row; requestAnimationFrame(() => row.classList.add("on"));
}

const forcedTheme = (location.search.match(/[?&]theme=(light|dark)/) || [])[1];
function applyTheme(light) {
  document.documentElement.classList.toggle("light", light);
  atmo.visible = !light;                       // additive glow has nothing to add on a light ground
  renderer.setClearColor(0x000000, 0);
}
function updateTheme() {
  const fixed = forcedTheme || (SET.theme !== "auto" ? SET.theme : null);   // ?theme= beats the setting
  if (fixed) return applyTheme(fixed === "light");
  if (!CFG.autoTheme || !S.weather) return;
  const d = S.weather.daily, i = d.time.length - 1, now = new Date();
  const local = now.toLocaleString("sv-SE", { timeZone: CFG.home.tz }).replace(" ", "T");   // YYYY-MM-DDTHH:MM:SS in home tz
  const m = mins(local), rise = mins(d.sunrise[i]) + CFG.twilightMin, set = mins(d.sunset[i]) - CFG.twilightMin;
  applyTheme(m > rise && m < set);
}

// =====================================================================
//  LOOP
// =====================================================================
const sunVec = new THREE.Vector3(), worldQ = new THREE.Quaternion();
let lastFrame = 0, lastSun = 0, lastStats = 0;
const frameMs = 1000 / CFG.fpsCap;
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden || now - lastFrame < frameMs) return;
  lastFrame = now;
  globe.rotation.y = (now / 1000 / CFG.rotationPeriodSec) * 2 * Math.PI;
  tilt.updateMatrixWorld(true);
  if (now - lastSun > 200) { const s = subsolar(new Date()); sunVec.copy(latLonToVec(s.lat, s.lon)); lastSun = now; }
  earthMat.uniforms.sunDir.value.copy(sunVec).applyQuaternion(globe.getWorldQuaternion(worldQ));
  // flicker decay
  for (const m of flickPool) if (m.visible) { const a = 1 - (now - m.userData.t) / 1400; if (a <= 0) m.visible = false; else m.material.opacity = a * 0.9; }
  renderer.render(scene, camera);
  placeCards();
  if (now - lastStats > 1000) { renderStats(); lastStats = now; }
}

// =====================================================================
//  BOOT
// =====================================================================
renderClock(); setInterval(renderClock, 1000);
updateTheme(); setInterval(updateTheme, 60000);
renderQR();
loadData(); setInterval(loadData, CFG.dataEveryMin * 60000);
pollWeather(); setInterval(pollWeather, 15 * 60000);
pollAir(); setInterval(pollAir, 30 * 60000);
pollISS(); setInterval(pollISS, 10000);
pollQuakes(); setInterval(pollQuakes, 5 * 60000);
pollSpaceWeather(); setInterval(pollSpaceWeather, 10 * 60000);
setTimeout(() => { nextTicker(); setInterval(nextTicker, CFG.tickerEverySec * 1000); }, 4000);
setTimeout(() => { pickHeadline(); setInterval(pickHeadline, CFG.headlineEverySec * 1000); }, 6000);
setInterval(renderFoot, 60000);
setTimeout(() => location.reload(), CFG.reloadEveryMin * 60000);
startWikiStream();
requestAnimationFrame(frame);
</script>
