<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ctext y=%2726%27 font-size=%2728%27%3E%E2%9B%B5%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sailing School — Sail Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../src/shared/ui.css">
<style>
html, body { height: 100%; overflow: hidden; }
body { display: flex; flex-direction: column; }

canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#stage { position: relative; flex: 1; min-height: 0; background: #06121C; }

/* ── overlays ───────────────────────────────────────────────────── */
.hud { position: absolute; pointer-events: none; }

#instruments {
  top: 14px; left: 14px;
  display: grid; grid-template-columns: repeat(3, minmax(96px, auto)); gap: 1px;
  background: var(--rule); border: 1px solid var(--rule);
}
#instruments div { background: rgba(9,20,28,.92); padding: 8px 11px; }
#instruments dt { font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 3px; }
#instruments dd { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 21px; font-variant-numeric: tabular-nums; }
#instruments dd small { font-size: 11px; font-weight: 400; color: var(--muted); font-family: var(--f-mono); }

#telltale {
  top: 14px; left: 50%; transform: translateX(-50%);
  background: rgba(9,20,28,.92); border: 1px solid var(--rule);
  padding: 8px 18px; text-align: center; min-width: 240px;
}
#telltale .state { font-family: var(--f-display); font-weight: 800; font-size: 17px; letter-spacing: .02em; }
#telltale .hint { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
#telltale.luff .state { color: var(--warn); }
#telltale.good .state { color: var(--ok); }
#telltale.stall .state { color: var(--err); }
#telltale.over .state { color: var(--err); }

#keys {
  bottom: 14px; left: 14px;
  background: rgba(9,20,28,.9); border: 1px solid var(--rule); padding: 9px 13px;
  font-size: 11px; color: var(--ink-2); line-height: 1.8;
}
#keys b { color: var(--ink); font-weight: 500; }

#join {
  bottom: 14px; right: 14px; pointer-events: auto;
  background: rgba(9,20,28,.92); border: 1px solid var(--rule); padding: 12px 14px;
  display: flex; flex-direction: column; gap: 8px; align-items: center; width: 190px;
}
#join .code { font-family: var(--f-display); font-weight: 800; font-size: 30px; letter-spacing: .1em; color: var(--magenta); }
#join .qr { width: 150px; background: #fff; padding: 6px; }
#join .qr svg { display: block; width: 100%; height: auto; }
#join .lbl { font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
#join .who { font-size: 11px; color: var(--ink-2); text-align: center; }

/* ── tuning ─────────────────────────────────────────────────────── */
#tune {
  position: absolute; top: 0; right: 0; bottom: 0; width: 320px;
  background: rgba(6,15,21,.97); border-left: 1px solid var(--rule);
  overflow-y: auto; padding: 14px; display: none; pointer-events: auto;
}
#tune.on { display: block; }
#tune h3 { font-family: var(--f-mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--magenta); margin: 14px 0 8px; }
#tune h3:first-child { margin-top: 0; }
.knob { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 9px; font-size: 11px; }
.knob label { color: var(--ink-2); }
.knob .val { font-family: var(--f-mono); color: var(--magenta); font-variant-numeric: tabular-nums; }
.knob input { grid-column: 1 / -1; width: 100%; accent-color: var(--magenta); }
#tune .note { font-size: 10.5px; color: var(--muted); line-height: 1.55; margin: 10px 0; }
#tune button { width: 100%; margin-top: 6px; }
</style>
</head>
<body>

<script src="../src/shared/config.js"></script>
<script src="../src/shared/boot-diag.js"></script>
<script src="../vendor/qrcode-generator-2.0.4.js"></script>

<div id="fatal" hidden style="position:fixed;bottom:0;left:0;right:0;z-index:50"></div>

<div id="stage">
  <canvas id="c"></canvas>

  <dl class="hud" id="instruments">
    <div><dt>Speed</dt><dd id="i-sog">0.0 <small>kn</small></dd></div>
    <div><dt>App. wind</dt><dd id="i-awa">0<small>°</small></dd></div>
    <div><dt>App. speed</dt><dd id="i-aws">0.0 <small>kn</small></dd></div>
    <div><dt>True wind</dt><dd id="i-twa">0<small>°</small></dd></div>
    <div><dt>Heel</dt><dd id="i-heel">0<small>°</small></dd></div>
    <div><dt>VMG</dt><dd id="i-vmg">0.0 <small>kn</small></dd></div>
    <div style="grid-column:1/-1"><dt>Point of sail</dt><dd id="i-pos" style="font-size:15px">—</dd></div>
  </dl>

  <div class="hud" id="telltale">
    <div class="state" id="t-state">LUFFING</div>
    <div class="hint" id="t-hint">sail flapping — trim in</div>
  </div>

  <div class="hud" id="keys">
    <b>&larr; &rarr;</b> tiller &nbsp; <b>&uarr; &darr;</b> mainsheet<br>
    <b>space</b> hike &nbsp; <b>~</b> tuning &nbsp; <b>R</b> reset &nbsp; <b>+ &minus;</b> zoom
  </div>

  <div class="hud" id="join">
    <span class="lbl">Sail it from a phone</span>
    <div class="code" id="j-code">····</div>
    <div class="qr" id="j-qr"></div>
    <div class="who" id="j-who">waiting…</div>
  </div>

  <div id="tune"></div>
</div>

<script type="module">
import { createWorld, addBoat, applyInput, pump, DT } from '../src/core/world.js';
import { windFrom } from '../src/core/wind.js';
import { createScene, resize, drawWater, drawWindStreaks, drawWakes, drawBoat,
         drawWindIndicator } from '../src/render/scene.js';
import { pointOfSail, tackName } from '../src/shared/compass.js';
import { BOATS, withOverrides } from '../src/shared/boats.js';
import { deg, rad, wrap, clamp } from '../src/shared/angles.js';
import { msToKn } from '../src/shared/units.js';
import { PeerHost } from '../src/net/peer-host.js';
import { qrSvg } from '../src/shared/qr.js';

const D = window.SSDiag; D.booted();
const $ = (id) => document.getElementById(id);
const Q = new URLSearchParams(location.search);

/* ── world ──────────────────────────────────────────────────────── */
const world = createWorld({
  wind: {
    speed: Number(Q.get('wind')) || 6,
    from: Math.PI / 2,
    seed: 11,
    steady: Q.get('steady') === '1'
  }
});
const me = addBoat(world, 'me', { theta: Math.PI / 2 - rad(50) });

/* ── keyboard ───────────────────────────────────────────────────── */
const keys = Object.create(null);
let kbRudder = 0, kbSheet = 0.2;
addEventListener('keydown', (e) => {
  keys[e.key] = true;
  if (e.key === '~') $('tune').classList.toggle('on');
  if (e.key === 'r' || e.key === 'R') reset();
  if (e.key === '+' || e.key === '=') scene.ppm = Math.min(40, scene.ppm * 1.25);
  if (e.key === '-' || e.key === '_') scene.ppm = Math.max(4, scene.ppm / 1.25);
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
});
addEventListener('keyup', (e) => { keys[e.key] = false; });

function reset() {
  me.p = { x: 0, y: 0 }; me.v = { x: 0, y: 0 };
  me.theta = Math.PI / 2 - rad(50); me.omega = 0; me.phi = 0;
  me.capsized = false; me.recovery = 0;
}

function readKeyboard(dt) {
  /* r > 0 puts the rudder to starboard, which turns the bow to starboard —
   * the same mapping as the phone tiller: push right, bow goes right. */
  const want = (keys.ArrowRight ? 1 : 0) + (keys.ArrowLeft ? -1 : 0);
  /* Springs back to centre like the phone tiller does. */
  kbRudder = want !== 0 ? clamp(kbRudder + want * dt * 2.4, -1, 1)
                        : kbRudder * Math.max(0, 1 - dt * 6);
  if (keys.ArrowUp) kbSheet = clamp(kbSheet - dt * 0.55, 0, 1);
  if (keys.ArrowDown) kbSheet = clamp(kbSheet + dt * 0.55, 0, 1);
  return { r: kbRudder, s: kbSheet, h: keys[' '] ? 1 : 0 };
}

/* ── phone controller, over the M0 transport ────────────────────── */
let phone = null;
const host = new PeerHost({
  onPlayers: (list) => {
    phone = list.length ? list[0] : null;
    $('j-who').textContent = list.length ? list[0].name + ' has the helm' : 'waiting…';
  }
});
host.open().then((code) => {
  $('j-code').textContent = code;
  $('j-qr').innerHTML = qrSvg(host.joinUrl, { dark: '#06121C', light: '#fff' });
}).catch((e) => {
  D.log('warn', 'no phone controller: ' + e.message);
  $('j-code').textContent = '——';
  $('j-who').textContent = 'keyboard only';
});

/* ── tuning overlay ─────────────────────────────────────────────── */
const KNOBS = [
  ['Sail', [
    ['sailArea', 4, 20, 0.1, 'm²'],
    ['camberGain', 1, 3, 0.05, '× flat plate'],
    ['parasiticCd', 0.05, 0.6, 0.01, 'Cd at zero AoA'],
    ['dragPeak', 0.6, 2.0, 0.05, 'Cd ceiling'],
    ['optimalAoA', 8, 30, 0.5, '° for telltales']
  ]],
  ['Hull and keel', [
    ['Kfwd', 3, 25, 0.5, 'quadratic drag'],
    ['LAT_OVER_FWD', 10, 90, 1, '← the critical ratio'],
    ['keelInduced', 0.0001, 0.004, 0.0001, 'price of side force'],
    ['waveK', 1, 3, 0.05, 'hump height'],
    ['planeDrag', 0.5, 1.2, 0.02, 'planing relief']
  ]],
  ['Steering and heel', [
    ['Krud', 40, 400, 5, 'rudder authority'],
    ['Cyaw', 100, 800, 10, 'yaw damping'],
    ['helmLever', 0, 0.8, 0.01, 'm — weather helm'],
    ['rightingHiked', 800, 3200, 25, 'N·m hiked'],
    ['capsizeAngle', 40, 85, 1, '°']
  ]]
];
const overrides = {};

function buildTune() {
  const box = $('tune');
  box.innerHTML = '<div class="note">Live constants. Nothing here is saved — copy the ' +
    'values you like into <code>src/shared/boats.js</code>, then re-run ' +
    '<code>node tools/polar-sweep.js</code> and <code>node --test test/*.test.mjs</code> ' +
    'to check you have not broken the polar.</div>';
  for (const [group, rows] of KNOBS) {
    const h = document.createElement('h3'); h.textContent = group; box.appendChild(h);
    for (const [key, min, max, step, unit] of rows) {
      const wrap = document.createElement('div'); wrap.className = 'knob';
      const cur = BOATS.dinghy[key];
      wrap.innerHTML = '<label>' + key + ' <span style="color:var(--muted)">' + unit + '</span></label>' +
        '<span class="val" id="v-' + key + '">' + cur + '</span>';
      const inp = document.createElement('input');
      inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step; inp.value = cur;
      inp.id = 'k-' + key;
      inp.addEventListener('input', () => {
        overrides[key] = Number(inp.value);
        $('v-' + key).textContent = inp.value;
        me.cls = withOverrides('dinghy', overrides);
      });
      wrap.appendChild(inp);
      box.appendChild(wrap);
    }
  }
  const b = document.createElement('button');
  b.className = 'btn ghost'; b.textContent = 'Copy overrides as JSON';
  b.addEventListener('click', () => {
    navigator.clipboard.writeText(JSON.stringify(overrides, null, 2));
    b.textContent = 'copied';
    setTimeout(() => { b.textContent = 'Copy overrides as JSON'; }, 1200);
  });
  box.appendChild(b);
}
buildTune();
if (Q.get('tune') === '1') $('tune').classList.add('on');

/* ── rendering ──────────────────────────────────────────────────────
 * Uses the shared renderer, so the dev view cannot drift away from what the
 * TV actually shows — which is how the wind indicator here ended up 90
 * degrees out from reality for a while. */
const scene = createScene($('c'), { fidelity: 'full', ppm: Number(Q.get('zoom')) || 15 });
addEventListener('resize', () => resize(scene));

/* ── telltales ──────────────────────────────────────────────────── */
function telltale(b) {
  const B = b.cls;
  if (b.capsized) return ['over', 'CAPSIZED', 'wait for her to come up'];
  if (b.out.luffing) return ['luff', 'LUFFING', 'sail flapping — trim in'];
  const aoa = deg(b.out.aoa), opt = B.optimalAoA;
  if (aoa > B.stallEnd) return ['stall', 'STALLED', 'over-trimmed — ease out'];
  if (aoa < opt - 6) return ['luff', 'ON THE EDGE', 'nearly luffing — trim in a touch'];
  if (aoa > opt + 6) return ['stall', 'OVER-TRIMMED', 'ease until she stops slowing'];
  return ['good', 'DRAWING WELL', 'that is the groove — hold it'];
}

/* ── loop ───────────────────────────────────────────────────────── */
let last = performance.now();
resize(scene);

function frame(now) {
  const elapsed = (now - last) / 1000; last = now;

  const kb = readKeyboard(Math.min(elapsed, 0.05));
  /* Whoever moved last has the helm, so you can hand it to a phone mid-sail. */
  const ph = phone && Math.abs(phone.r) > 0.02 ? { r: phone.r, s: kb.s, h: kb.h } : null;
  applyInput(world, 'me', ph || kb);

  pump(world, elapsed);

  scene.camera.x = me.p.x; scene.camera.y = me.p.y;
  drawWater(scene, world.wind);
  drawWindStreaks(scene, world.wind, world.time);
  drawWakes(scene, [me]);
  drawBoat(scene, me, { hiking: me.input.h });
  drawWindIndicator(scene, world.wind, { right: $('tune').classList.contains('on') ? 320 : 0 });

  const o = me.out;
  $('i-sog').innerHTML = msToKn(o.sog).toFixed(1) + ' <small>kn</small>';
  $('i-awa').innerHTML = Math.abs(deg(o.awa)).toFixed(0) + '<small>° ' +
    (o.awa > 0 ? 'port' : 'stbd') + '</small>';
  $('i-aws').innerHTML = msToKn(o.aws).toFixed(1) + ' <small>kn</small>';
  const twa = deg(wrap(windFrom(world.wind) - me.theta));
  const pos = pointOfSail(twa), tack = tackName(twa);
  $('i-twa').innerHTML = Math.abs(twa).toFixed(0) + '<small>° ' + (tack || '') + '</small>';
  $('i-pos').textContent = pos.name;
  $('i-heel').innerHTML = Math.abs(o.heelDeg).toFixed(0) + '<small>° ' +
    (o.heelDeg > 0 ? 'stbd' : 'port') + '</small>';
  $('i-vmg').innerHTML = msToKn(o.sog * Math.cos(rad(twa))).toFixed(1) + ' <small>kn</small>';

  const [cls, state, hint] = telltale(me);
  const tt = $('telltale');
  tt.className = 'hud ' + cls;
  $('t-state').textContent = state;
  $('t-hint').textContent = hint;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
