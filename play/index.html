<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ctext y=%2726%27 font-size=%2728%27%3E%E2%9B%B5%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#0B131A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sailing School — Controller</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../src/shared/ui.css">
<style>
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  display: flex; flex-direction: column; gap: 8px;
  padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* ── join ───────────────────────────────────────────────────────── */
#join { display: flex; flex-direction: column; gap: 15px; justify-content: center; flex: 1; padding: 0 6px; }
#join h1 { font-size: 30px; font-weight: 800; }
#join p { color: var(--ink-2); font-size: 13.5px; line-height: 1.6; margin: 0; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.field input {
  font-family: var(--f-display); font-weight: 700; font-size: 26px;
  background: var(--surface); border: 1px solid var(--rule); color: var(--ink);
  padding: 12px 14px; width: 100%; letter-spacing: .12em; text-transform: uppercase;
}
.field input.name { font-size: 18px; letter-spacing: 0; text-transform: none; }
.hulls { display: flex; gap: 8px; }
.hulls button { width: 34px; height: 34px; border: 2px solid transparent; cursor: pointer; padding: 0; }
.hulls button[aria-pressed="true"] { border-color: var(--ink); }

/* assist picker — per player, so a beginner sails alongside an expert */
.levels { display: flex; flex-direction: column; gap: 6px; }
.levels button {
  text-align: left; background: var(--surface); border: 1px solid var(--rule);
  color: var(--ink-2); padding: 9px 12px; cursor: pointer; font-family: inherit;
}
.levels button[aria-pressed="true"] { border-color: var(--magenta); background: #1E1420; color: var(--ink); }
.levels b { display: block; font-family: var(--f-display); font-size: 14px; color: var(--ink); }
.levels span { font-size: 11px; line-height: 1.45; }
.levels button[aria-pressed="true"] b { color: var(--magenta); }

/* the same choice, reachable while sailing — scanning the QR skips the join
   form entirely, so the join-screen picker alone would never be seen by the
   people who most need it */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--rule);
  border: 1px solid var(--rule); }
.seg button {
  background: var(--surface); border: 0; color: var(--muted); padding: 7px 4px;
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
}
.seg button[aria-pressed="true"] { background: var(--magenta); color: var(--paper); font-weight: 600; }

/* ── controller ─────────────────────────────────────────────────── */
#ctl { display: none; flex-direction: column; flex: 1; gap: 8px; min-height: 0; }
#ctl.live { display: flex; }

/* status */
.status { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
.dot.connected { background: var(--ok); }
.dot.connecting, .dot.reconnecting, .dot.slow { background: var(--warn); }
.dot.failed { background: var(--err); }
.status .right { margin-left: auto; font-variant-numeric: tabular-nums; }

/* ── telltales: the teaching device ─────────────────────────────── */
#tt {
  border: 1px solid var(--rule); background: var(--surface);
  padding: 9px 12px; text-align: center; transition: background .18s, border-color .18s;
}
#tt .title { font-family: var(--f-display); font-weight: 800; font-size: 17px; letter-spacing: .02em; }
#tt .hint { font-size: 11px; color: var(--ink-2); margin-top: 1px; }
#tt .ribbons { display: flex; justify-content: center; gap: 5px; height: 15px; margin-bottom: 6px; }
#tt .ribbons i {
  display: block; width: 3px; height: 100%; background: var(--muted);
  transform-origin: top center; border-radius: 2px;
}
#tt.good   { border-color: var(--ok);   background: #0E241B; }
#tt.good .title { color: var(--ok); }
#tt.good .ribbons i { background: var(--ok); }
#tt.edge, #tt.luffing { border-color: var(--warn); background: #241C0C; }
#tt.edge .title, #tt.luffing .title { color: var(--warn); }
#tt.edge .ribbons i, #tt.luffing .ribbons i { background: var(--warn); animation: flap .32s infinite alternate ease-in-out; }
#tt.luffing .ribbons i { animation-duration: .16s; }
#tt.over, #tt.stalled { border-color: var(--err); background: #2A1210; }
#tt.over .title, #tt.stalled .title { color: var(--err); }
#tt.over .ribbons i, #tt.stalled .ribbons i { background: var(--err); animation: churn .5s infinite alternate ease-in-out; }
#tt.running { border-color: var(--shoal); background: #10202B; }
#tt.running .title { color: var(--shoal); }
#tt.running .ribbons i { background: var(--shoal); }
#tt.auto { border-color: var(--magenta); background: #1E1420; }
#tt.auto .title { color: var(--magenta); }
#tt.auto .ribbons i { background: var(--magenta); }
#tt.capsized { border-color: var(--err); background: #2A1210; }
#tt.capsized .title { color: var(--err); }
#tt .ribbons i:nth-child(2) { animation-delay: .05s }
#tt .ribbons i:nth-child(3) { animation-delay: .1s }
#tt .ribbons i:nth-child(4) { animation-delay: .15s }
#tt .ribbons i:nth-child(5) { animation-delay: .2s }
@keyframes flap  { from { transform: rotate(-24deg) } to { transform: rotate(26deg) } }
@keyframes churn { from { transform: rotate(6deg) scaleY(.75) } to { transform: rotate(-8deg) scaleY(1) } }
@media (prefers-reduced-motion: reduce) { #tt .ribbons i { animation: none !important } }

/* planing — the second lesson, kept separate from the telltales because
   telltales genuinely cannot teach it */
#plane {
  border: 1px solid var(--rule); background: var(--surface);
  padding: 4px 9px; font-size: 10px; letter-spacing: .13em; text-transform: uppercase;
  color: var(--muted); text-align: center; transition: background .2s, color .2s;
}
#plane[data-state="onthehump"] { color: var(--warn); border-color: var(--warn); }
#plane[data-state="planing"] { background: var(--magenta); color: var(--paper); border-color: var(--magenta); font-weight: 600; }

/* orientation: where the wind is, drawn BOAT-UP so it matches what you are
   steering rather than the map on the TV */
.orient { display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: center;
  background: var(--surface); border: 1px solid var(--rule); padding: 8px 12px 8px 8px; }
.orient .dial svg { display: block; width: 92px; height: 92px; }
.orient .pos .name { font-family: var(--f-display); font-weight: 800; font-size: 16px; line-height: 1.15; }
.orient .pos .sub { font-size: 11px; color: var(--ink-2); margin-top: 3px; line-height: 1.4; }
.orient.nogo { border-color: var(--err); }
.orient.nogo .pos .name { color: var(--err); }

/* instruments */
.readout { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.readout div { background: var(--surface); padding: 6px 7px; }
.readout dt { font-size: 8.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); margin: 0 0 2px; }
.readout dd { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.readout dd small { font-size: 9px; font-weight: 400; color: var(--muted); font-family: var(--f-mono); }

/* heel bar */
#heelbar {
  height: 15px; background: var(--surface); border: 1px solid var(--rule);
  position: relative; overflow: hidden;
}
#heelbar .mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--muted); opacity: .7; }
/* No explicit width: the fill is stretched by setting left AND right from
   JS, and a declared width makes `right` inert. */
#heelbar .fill { position: absolute; top: 2px; bottom: 2px; background: var(--shoal); left: 50%; right: 50%; opacity: .85; transition: background .2s; }
#heelbar.hot .fill { background: var(--err); }
/* where she goes over — the line you are trying not to cross */
#heelbar .lim { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--err); opacity: .5; }
#heelbar .lim.l { left: 8%; } #heelbar .lim.r { right: 8%; }
#heelbar .cap { position: absolute; inset: 0; text-align: center; font-size: 8.5px;
  line-height: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); pointer-events: none; }
#heelbar.hot .cap { color: #FFD9D4; }

/* ── the lobby strip ────────────────────────────────────────────────
   Voting happens by sailing, so this never asks for a decision — it reports
   one and lets you adjust the fine print of the ring you are already in. */
#lobby { border: 1px solid var(--rule); background: var(--surface); padding: 8px 10px; }
#lobby[hidden] { display: none }
#lobby.inzone { border-color: var(--shoal); }
#lobby.counting { border-color: var(--magenta); background: #1E1420; }
#lobby.placard { border-color: var(--ok); background: #0E241B; }

#lobby .top { display: flex; align-items: baseline; gap: 8px; }
#lobby .nm { font-family: var(--f-display); font-weight: 800; font-size: 15px; }
#lobby .cl { margin-left: auto; font-family: var(--f-mono); font-size: 12px;
  color: var(--shoal); font-variant-numeric: tabular-nums; }
#lobby.counting .nm, #lobby.counting .cl { color: var(--magenta); }
#lobby .vt { font-size: 11px; color: var(--ink-2); margin-top: 2px; line-height: 1.4; }

#lobby .bar { height: 4px; background: var(--rule); margin-top: 6px; overflow: hidden; }
#lobby .bar i { display: block; height: 100%; width: 0; background: var(--shoal);
  transition: width .25s linear; }
#lobby.counting .bar i { background: var(--magenta); }

/* Coarse choice in the world, fine choice here. Chips, never sliders: the
   value IS the whole state, so a dropped packet cannot leave two phones
   disagreeing about what the room decided. */
#lobby .opts { margin-top: 8px; display: flex; flex-direction: column; gap: 6px;
  max-height: 140px; overflow-y: auto; overscroll-behavior: contain; }
#lobby .opts:empty { display: none }
#lobby .orow { display: flex; align-items: center; gap: 6px; }
#lobby .orow > label { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); width: 62px; flex: 0 0 auto; }
#lobby .chips { display: flex; gap: 4px; flex-wrap: wrap; }
#lobby .chips button {
  background: var(--surface-2); border: 1px solid var(--rule); color: var(--ink-2);
  font-family: var(--f-mono); font-size: 11px; padding: 5px 9px;
}
#lobby .chips button[aria-pressed="true"] {
  background: var(--shoal); border-color: var(--shoal); color: var(--paper); font-weight: 600;
}
#lobby .chips button[disabled] { opacity: .45; }

#l-start {
  width: 100%; margin-top: 8px; background: var(--shoal); color: var(--paper);
  border: 0; padding: 10px; font-family: var(--f-display); font-weight: 700;
  font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
}
#l-start[hidden] { display: none }
#l-start[disabled] { opacity: .4; }

/* ── the controls ───────────────────────────────────────────────── */
.zones { flex: 1; display: grid; grid-template-columns: 84px 1fr; gap: 8px; min-height: 150px; }

.zone {
  position: relative; background: var(--surface); border: 1px solid var(--rule);
  touch-action: none; overscroll-behavior: none; overflow: hidden;
}
.zone .cap {
  position: absolute; left: 0; right: 0; text-align: center; pointer-events: none;
  font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}

#sheet.auto { opacity: .4; }
#sheet.auto .grip { background: var(--muted); }

/* mainsheet: vertical, stays where you put it */
#sheet { --s: .25; }
#sheet .cap { top: 7px; }
#sheet .track { position: absolute; left: 50%; top: 26px; bottom: 26px; width: 2px; background: var(--rule); transform: translateX(-50%); }
#sheet .grip {
  position: absolute; left: 7px; right: 7px; height: 34px;
  background: var(--magenta); border-radius: 2px;
  top: calc(26px + (100% - 52px - 34px) * var(--s));
}
#sheet .ends { position: absolute; left: 0; right: 0; font-size: 8.5px; color: var(--muted); text-align: center; }
#sheet .ends.in { top: 22px; } #sheet .ends.out { bottom: 7px; }

/* tiller: horizontal, springs back */
#tiller { --v: 0; }
#tiller .cap { bottom: 8px; }
#tiller .mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--rule); }
#tiller .grip {
  position: absolute; top: 14px; bottom: 30px; width: 46px;
  background: var(--magenta); border-radius: 3px; opacity: .92;
  left: 50%; transform: translateX(calc(-50% + var(--v) * (50cqw - 30px)));
}
#tiller .grip::after {
  content: ''; position: absolute; left: 50%; top: 12%; bottom: 12%;
  width: 2px; margin-left: -1px; background: rgba(11,19,26,.45);
}
#tiller { container-type: inline-size; }
#tiller.touched .cap { opacity: .35; }

/* hike */
#hike {
  height: 62px; background: var(--surface-2); border: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .04em;
  touch-action: none; color: var(--ink-2);
}
#hike.down { background: var(--magenta); color: var(--paper); border-color: var(--magenta); }
#hike small { font-family: var(--f-mono); font-weight: 400; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; opacity: .8; }

/* banner */
#banner {
  position: fixed; left: 10px; right: 10px; bottom: max(10px, env(safe-area-inset-bottom));
  background: var(--magenta); color: var(--paper); padding: 11px 14px; z-index: 30;
  font-family: var(--f-display); font-weight: 700; font-size: 14px; text-align: center;
}
#banner[hidden] { display: none }

/* Short phones. The lobby strip is 200-odd pixels that did not exist in M2,
   and on a 667-tall screen it pushed the tiller off the bottom — which is the
   one control you need to hold station in a ring. So on a short screen the
   instruments give the space back, because while you are voting the ring is
   the thing you are reading anyway. */
@media (max-height: 740px) {
  body { gap: 6px; }
  .orient { grid-template-columns: 68px 1fr; padding: 6px 10px 6px 6px; }
  .orient .dial svg { width: 68px; height: 68px; }
  .orient .pos .name { font-size: 14px; }
  #tt { padding: 6px 10px; }
  #tt .ribbons { height: 11px; margin-bottom: 4px; }
  .readout dd { font-size: 14px; }
  #hike { height: 50px; }
  /* Three rows is the most any mode asks for, so this never actually
     scrolls — it is a backstop for a mode added later, not a design. */
  #lobby .opts { max-height: 104px; }

  /* Standing in a ring, on a small phone, something has to go — and the
     tiller is not negotiable, because holding station in a circle is the
     whole task. So the navigation instruments fold away: you have arrived,
     you are not looking for the wind any more, and the telltale and the ring
     are what you are actually reading. They come straight back when you sail
     out. */
  body.voting .orient, body.voting #plane { display: none; }
}

.tog { background: none; border: 0; color: var(--muted); font-family: var(--f-mono); font-size: 10.5px; padding: 2px 0; text-decoration: underline; }
.diagwrap { max-height: 30vh; overflow-y: auto; }
</style>
</head>
<body>

<script src="../src/shared/config.js"></script>
<script src="../src/shared/boot-diag.js"></script>

<div id="fatal" hidden style="position:fixed;left:0;right:0;bottom:0;z-index:40"></div>
<div id="banner" hidden></div>

<div id="join">
  <div>
    <p class="eyebrow">Sailing School</p>
    <h1>Take the helm</h1>
  </div>
  <p>Enter the code on the screen, or scan the QR to skip this.</p>
  <div class="field">
    <label for="code">Room code</label>
    <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters"
           autocorrect="off" spellcheck="false" placeholder="ABCD">
  </div>
  <div class="field">
    <label for="name">Your name</label>
    <input id="name" class="name" maxlength="16" autocomplete="off" spellcheck="false">
  </div>
  <div class="field">
    <label>Hull</label>
    <div class="hulls" id="hulls"></div>
  </div>
  <div class="field">
    <label>How much help?</label>
    <div class="levels" id="levels"></div>
  </div>
  <button class="btn" id="go">Join</button>
</div>

<div id="ctl">
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="state">connecting…</span>
    <span class="right" id="rtt"></span>
  </div>

  <div id="lobby" hidden>
    <div class="top">
      <span class="nm" id="l-nm">Open water</span>
      <span class="cl" id="l-cl"></span>
    </div>
    <div class="vt" id="l-vt"></div>
    <div class="bar"><i id="l-bar"></i></div>
    <div class="opts" id="l-opts"></div>
    <button id="l-start" hidden>Start now</button>
  </div>

  <div id="tt">
    <div class="ribbons"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="title" id="tt-title">WAITING</div>
    <div class="hint" id="tt-hint">connecting to the boat</div>
  </div>

  <div class="orient">
    <div class="dial" id="dial"></div>
    <div class="pos">
      <div class="name" id="r-pos">—</div>
      <div class="sub" id="r-tack">finding the wind…</div>
    </div>
  </div>

  <dl class="readout">
    <div><dt>Speed</dt><dd id="r-sog">—</dd></div>
    <div><dt>Wind angle</dt><dd id="r-awa">—</dd></div>
    <div><dt>VMG</dt><dd id="r-vmg">—</dd></div>
    <div><dt>Heel</dt><dd id="r-heel">—</dd></div>
  </dl>
  <div id="heelbar"><span class="lim l"></span><span class="lim r"></span><div class="mid"></div><div class="fill"></div><span class="cap" id="heel-cap">heel</span></div>
  <div id="plane" data-state="displacing"><span id="plane-txt">displacing</span></div>

  <div class="zones">
    <div class="zone" id="sheet">
      <span class="cap">Mainsheet</span>
      <span class="ends in">in</span>
      <div class="track"></div>
      <div class="grip"></div>
      <span class="ends out">out</span>
    </div>
    <div class="zone" id="tiller">
      <div class="mid"></div>
      <div class="grip"></div>
      <span class="cap">Tiller — drag left / right</span>
    </div>
  </div>

  <div id="hike">HIKE OUT <small>hold</small></div>

  <div class="seg" id="levels2" aria-label="How much help"></div>

  <button class="tog" id="tog">diagnostics</button>
  <div class="diagwrap" id="diagwrap" hidden>
    <div class="probe" id="probe"></div>
    <div class="verdict" id="verdict"></div>
    <div id="diag-log"></div>
    <div class="ua" id="ua"></div>
  </div>
</div>

<script type="module">
import { PeerClient } from '../src/net/peer-client.js';
import { loadProfile, saveProfile } from '../src/shared/profile.js';
import { makeTiller, makeSheet, makeHold } from '../src/controller/surfaces.js';
import { EVENTS } from '../src/net/protocol.js';
import { ASSISTS, LEVELS } from '../src/shared/assists.js';
import { dialMarkup, updateDial } from '../src/controller/dial.js';
import { MODES, describe as describeMode } from '../src/shared/modes.js';

const D = window.SSDiag; D.booted();
const $ = (id) => document.getElementById(id);
$('verdict').textContent = D.verdict();

const HULLS = ['#B3117A', '#E3B341', '#43BE88', '#78ADCE', '#E97A6F', '#E9EEF2'];
const profile = loadProfile();
$('name').value = profile.name;

HULLS.forEach((c) => {
  const b = document.createElement('button');
  b.style.background = c;
  b.setAttribute('aria-pressed', String(c === profile.hull));
  b.addEventListener('click', () => {
    profile.hull = c; saveProfile(profile);
    [...$('hulls').children].forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  });
  $('hulls').appendChild(b);
});

/* ── assist picker ──────────────────────────────────────────────── */
function paintLevels() {
  for (const box of [$('levels'), $('levels2')]) {
    [...box.children].forEach((b) =>
      b.setAttribute('aria-pressed', String(b.dataset.level === profile.assist)));
  }
}
function chooseLevel(id) {
  profile.assist = id;
  saveProfile(profile);
  paintLevels();
  if (client) {
    client.setAssist(id);          // switch mid-game without losing the boat
    banner(ASSISTS[id].name + ' — ' + ASSISTS[id].blurb, 2600);
  }
}
LEVELS.forEach((id) => {
  const a = ASSISTS[id];
  const full = document.createElement('button');
  full.dataset.level = id;
  full.innerHTML = '<b>' + a.name + '</b><span>' + a.blurb + '</span>';
  full.addEventListener('click', () => chooseLevel(id));
  $('levels').appendChild(full);

  const mini = document.createElement('button');
  mini.dataset.level = id;
  mini.textContent = a.name;
  mini.addEventListener('click', () => chooseLevel(id));
  $('levels2').appendChild(mini);
});
paintLevels();

$('dial').innerHTML = dialMarkup();

let client = null;

$('go').addEventListener('click', join);
$('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') join(); });

function join() {
  const code = $('code').value.trim().toUpperCase();
  if (!/^[A-Z0-9]{4}$/.test(code)) {
    D.fatal('That does not look like a room code — four letters or digits.');
    return;
  }
  const name = $('name').value.trim() || profile.name;
  if (name !== profile.name) { profile.name = name; saveProfile(profile); }

  $('join').style.display = 'none';
  $('ctl').classList.add('live');

  client = new PeerClient(code, profile, {
    onState: (s, detail) => {
      $('dot').className = 'dot ' + s;
      $('state').textContent = detail ? s + ' — ' + detail : s;
      if (s !== 'connected') setTelltale({ tt: null });
    },
    onWelcome: () => banner('You have the helm', 1600),
    onTelemetry: (m, rtt) => {
      $('rtt').textContent = rtt === null ? '' : rtt + ' ms';
      paint(m);
    },
    onZone: (z) => paintLobby(z),
    onEvent: (kind, detail) => onEvent(kind, detail)
  });
  /* Send the starting trim immediately so the boat is not sitting sheeted in. */
  client.setControls({ r: 0, s: sheet.value, h: 0 });
  client.connect();
  keepAwake();
  /* Debug handle, matching window.SS on the host. Remote-debugging a phone is
   * awkward enough without having to reach into a module scope. */
  window.SSC = client;
}

/* ── control surfaces ───────────────────────────────────────────── */
const tiller = makeTiller($('tiller'), {
  onChange: (v) => { if (client) client.setControls({ r: v }); }
});
const sheet = makeSheet($('sheet'), {
  initial: 0.25,
  onChange: (v) => { if (client) client.setControls({ s: v }); }
});
const hike = makeHold($('hike'), {
  onChange: (v) => {
    if (client) client.setControls({ h: v });
    if (v) buzz(12);
  }
});

/* ── telemetry paint ────────────────────────────────────────────── */
let lastBand = null;

function paint(m) {
  $('r-sog').innerHTML = m.sog.toFixed(1) + ' <small>kn</small>';
  const side = m.awa > 0 ? 'port' : 'stbd';
  $('r-awa').innerHTML = Math.abs(m.awa) + '<small>° ' + side + '</small>';
  $('r-vmg').innerHTML = m.vmg.toFixed(1) + ' <small>kn</small>';
  $('r-heel').innerHTML = Math.abs(m.heel) + '<small>°</small>';

  /* Where the wind is, boat-up. The single cue that stops a beginner losing
   * track of the wind while they are busy steering. */
  updateDial($('dial'), m.twa);
  $('r-pos').textContent = m.pos || '—';
  $('r-tack').textContent = m.tk ? 'wind over the ' + m.tk + ' side' : 'wind dead ahead or astern';
  document.querySelector('.orient').classList.toggle('nogo', Math.abs(m.twa) < 40);

  const bar = $('heelbar'), fill = bar.querySelector('.fill');
  const pct = Math.min(1, Math.abs(m.heel) / 60) * 50;
  if (m.heel >= 0) { fill.style.left = '50%'; fill.style.right = (50 - pct) + '%'; }
  else { fill.style.right = '50%'; fill.style.left = (50 - pct) + '%'; }
  bar.classList.toggle('hot', Math.abs(m.heel) > 38);
  document.getElementById('heel-cap').textContent =
    Math.abs(m.heel) > 38 ? 'HIKE OUT' : 'heel ' + Math.abs(m.heel) + '°';

  setTelltale(m);
  setPlaning(m.pl);
  /* On arcade the mainsheet is not the player's to move; dim it rather than
   * leaving a live-looking control that does nothing. */
  $('sheet').classList.toggle('auto', m.tt === 'auto');
}

const PLANE_COPY = {
  displacing: 'displacing',
  onthehump: 'on the hump — bear away to get her up',
  planing: 'PLANING'
};
let lastPlane = null;
function setPlaning(state) {
  if (!state) return;
  const el = $('plane');
  el.dataset.state = state;
  $('plane-txt').textContent = PLANE_COPY[state] || state;
  if (state !== lastPlane) {
    if (state === 'planing') buzz([25, 30, 25]);
    lastPlane = state;
  }
}

/* ── the lobby strip ────────────────────────────────────────────── */

let lobbyView = null;
let optsSignature = '';          // what the chips currently describe

$('l-start').addEventListener('click', () => {
  if (client) { client.requestStart(); buzz(20); }
});

function paintLobby(z) {
  lobbyView = z;
  const box = $('lobby');
  box.hidden = false;
  /* Drives the small-screen layout: see the max-height media query above. */
  document.body.classList.toggle('voting', !!z.z || z.ph !== 'harbour');

  const modeName = (id) => (MODES[id] ? MODES[id].name : id);

  if (z.ph === 'placard') {
    box.className = 'placard';
    $('l-nm').textContent = z.ch ? modeName(z.ch.mode) : 'Chosen';
    $('l-cl').textContent = '';
    $('l-vt').textContent = z.ch ? describeMode(z.ch.mode, z.ch.options) : '';
    setBar(100);
    renderOptions(null, null, true);
    $('l-start').hidden = true;
    return;
  }

  if (z.ph === 'countdown') {
    box.className = 'counting';
    $('l-nm').textContent = modeName(z.ld && MODES[z.ld] ? z.ld : (z.mo || z.ld));
    $('l-cl').textContent = z.cd + 's';
    $('l-vt').textContent = z.z === z.ld
      ? 'You are in it. Hold on.'
      : 'Sail to another ring with the others to change it.';
    setBar(100);
    renderOptions(z.mo, z.opts, true);
    $('l-start').hidden = !z.hm;
    $('l-start').disabled = false;
    $('l-start').textContent = 'Go now';
    return;
  }

  /* harbour */
  if (!z.z) {
    box.className = '';
    $('l-nm').textContent = 'Open water';
    $('l-cl').textContent = '';
    $('l-vt').textContent = z.need > 1
      ? 'Sail into a ring to vote — ' + z.need + ' boats in the same one starts it.'
      : 'Sail into a ring to vote.';
    setBar(0);
    renderOptions(null, null, false);
  } else {
    box.className = 'inzone';
    $('l-nm').textContent = modeName(z.mo);
    $('l-cl').textContent = z.cl + '%';
    const short = Math.max(0, z.need - z.vt);
    $('l-vt').textContent = z.vt + (z.vt === 1 ? ' boat' : ' boats') + ' here' +
      (short > 0 ? ' — ' + short + ' more and it starts' : ' — holding');
    setBar(z.cl);
    renderOptions(z.mo, z.opts, false);
  }
  $('l-start').hidden = !z.hm;
  $('l-start').disabled = false;
  $('l-start').textContent = 'Start now';
}

function setBar(pct) { $('l-bar').style.width = Math.max(0, Math.min(100, pct)) + '%'; }

/**
 * Chips for the ring you are standing in. Rebuilt only when the SHAPE changes;
 * a value arriving at 10 Hz must not tear a button out from under a thumb.
 */
function renderOptions(modeId, values, frozen) {
  const m = modeId ? MODES[modeId] : null;
  const sig = m ? modeId + ':' + m.options.map((o) => o.key).join(',') : '';
  const box = $('l-opts');

  if (sig !== optsSignature) {
    optsSignature = sig;
    box.innerHTML = '';
    if (m) {
      for (const o of m.options) {
        const row = document.createElement('div');
        row.className = 'orow';
        const lab = document.createElement('label');
        lab.textContent = o.name;
        row.appendChild(lab);
        const chips = document.createElement('div');
        chips.className = 'chips';
        o.values.forEach((v, i) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.dataset.key = o.key;
          b.dataset.value = String(v);
          b.textContent = o.labels[i];
          b.addEventListener('click', () => {
            if (b.disabled || !client) return;
            client.setOption(o.key, v);
            /* Light it immediately; the host's answer overwrites this on the
             * next zone message and is the one that counts. */
            [...chips.children].forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
            buzz(10);
          });
          chips.appendChild(b);
        });
        row.appendChild(chips);
        box.appendChild(row);
      }
    }
  }

  if (!m) return;
  for (const b of box.querySelectorAll('button')) {
    const cur = values ? values[b.dataset.key] : undefined;
    b.setAttribute('aria-pressed', String(cur !== undefined && String(cur) === b.dataset.value));
    b.disabled = !!frozen;
  }
}

const COPY = {
  luffing:  ['LUFFING', 'sail flapping — trim in'],
  edge:     ['ON THE EDGE', 'nearly luffing — trim in a touch'],
  good:     ['DRAWING WELL', 'that is the groove — hold it'],
  over:     ['OVER-TRIMMED', 'ease until she stops slowing'],
  stalled:  ['STALLED', 'way over-trimmed — ease out'],
  running:  ['RUNNING', 'squared right off'],
  auto:     ['TRIMMED FOR YOU', 'just steer — the sail looks after itself'],
  capsized: ['CAPSIZED', 'hold on — she is coming up']
};

function setTelltale(m) {
  const band = m && m.tt ? m.tt : null;
  const el = $('tt');
  if (!band) {
    el.className = '';
    $('tt-title').textContent = 'WAITING';
    $('tt-hint').textContent = 'connecting to the boat';
    lastBand = null;
    return;
  }
  el.className = band;
  const [title, hint] = COPY[band] || [band.toUpperCase(), ''];
  $('tt-title').textContent = title;
  $('tt-hint').textContent = hint;

  /* A short buzz the moment she comes into the groove, and a longer one when
   * she falls out of it. Learning the sheet by feel, not by reading. */
  if (band !== lastBand) {
    if (band === 'good') buzz(18);
    else if (lastBand === 'good') buzz([12, 40, 12]);
    lastBand = band;
  }
}

function onEvent(kind, detail) {
  if (kind === EVENTS.CAPSIZE) { banner('Capsized — sit tight', 2600); buzz([40, 60, 40, 60, 90]); }
  if (kind === EVENTS.RECOVERED) { banner('Back up — sheet is eased', 1800); buzz(25); }
  if (kind === EVENTS.IN_IRONS) banner('In irons — no way on to steer', 2200);
  if (kind === EVENTS.TACK) buzz(15);
  if (kind === EVENTS.GYBE) buzz([15, 40, 15]);

  /* The lobby speaks through the phone as well as the TV, because at the
   * moment it matters everyone is looking down at their own hands. */
  if (kind === EVENTS.COUNTDOWN) { banner((detail || 'A game') + ' — starting', 2400); buzz([20, 60, 20]); }
  if (kind === EVENTS.SWITCHED) { banner('Changed to ' + (detail || 'another mode'), 2400); buzz([20, 60, 20, 60, 20]); }
  if (kind === EVENTS.HORN) buzz([80, 50, 80]);
  if (kind === EVENTS.RESOLVED) banner(detail || 'Chosen', 3000);
  if (kind === EVENTS.DRIFT) banner(detail || 'The harbour shifted', 5000);
  if (kind === EVENTS.HARBOURMASTER) {
    banner('You are the harbourmaster — you can start early', 3600);
    buzz([15, 40, 15]);
  }
}

let bannerTimer = 0;
function banner(text, ms) {
  const b = $('banner');
  b.textContent = text; b.hidden = false;
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => { b.hidden = true; }, ms || 2000);
}

/* Silently absent on iOS. Never make it load-bearing. */
function buzz(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* ignore */ }
}

/* ── screen wake lock ───────────────────────────────────────────── */
let lock = null;
async function keepAwake() {
  if (!('wakeLock' in navigator)) {
    D.log('warn', 'no Screen Wake Lock here — the screen may sleep mid-race');
    return;
  }
  try {
    lock = await navigator.wakeLock.request('screen');
    lock.addEventListener('release', () => { lock = null; });
    D.log('ok', 'screen wake lock held');
  } catch (e) { D.log('warn', 'wake lock refused: ' + e.message); }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && client && !lock) keepAwake();
});

$('tog').addEventListener('click', () => {
  const w = $('diagwrap'); w.hidden = !w.hidden;
});
window.addEventListener('pagehide', () => { if (client) client.close(); });

/* ── auto-join ──────────────────────────────────────────────────── */
const fromHash = (location.hash || '').replace('#', '').trim().toUpperCase();
if (/^[A-Z0-9]{4}$/.test(fromHash)) { $('code').value = fromHash; join(); }
else $('code').focus();
</script>
