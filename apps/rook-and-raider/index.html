<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rook &amp; Raider</title>
<style>
:root{--ink:#e9dfc6;--dim:#a39a82;--brass:#c9a44c;--brass2:#8a6f30;--bg:#0f0d0b;--panel:rgba(20,17,13,.93);--line:#5c4c2a;--red:#e0523f;--crim:#c0392b;--green:#86c06c;--blue:#7fd6f2;
  --serif:Georgia,'Times New Roman',serif;--mono:ui-monospace,Consolas,Menlo,'DejaVu Sans Mono',monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 var(--serif);overflow:hidden;user-select:none;-webkit-user-select:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font:inherit;color:var(--ink);background:#2a2318;border:1px solid var(--line);border-radius:3px;padding:7px 14px;cursor:pointer;letter-spacing:.04em}
button:hover{background:#3a301f;border-color:var(--brass)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--brass2);border-color:var(--brass);color:#fff8e4}
button.primary:hover{background:#a08238}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
input,select{font:inherit;color:var(--ink);background:#17130d;border:1px solid var(--line);border-radius:3px;padding:6px 8px}
h1,h2,h3{font-weight:normal;margin:0;letter-spacing:.14em;text-transform:uppercase}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- screens (menu / lobby) */
#screens{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 35%,#2a2218 0,#0f0d0b 70%);overflow:auto;padding:20px}
.card{width:min(760px,100%);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:28px 32px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.title{text-align:center;margin-bottom:6px}
.title h1{font-size:44px;letter-spacing:.2em;color:var(--ink)}
.title h1 b{color:var(--brass);font-weight:normal}
.title h1 i{color:var(--crim);font-style:normal}
.title p{color:var(--dim);margin:6px 0 0;font-style:italic}
.pieces{font-size:30px;text-align:center;letter-spacing:.35em;color:var(--brass);margin:10px 0 18px}
.pieces i{color:var(--crim);font-style:normal}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.menu button{padding:16px;font-size:16px;text-align:left}
.menu button small{display:block;color:var(--dim);font-size:12px;letter-spacing:0;margin-top:3px;font-style:italic}
.row{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
.row label{width:130px;color:var(--dim);text-transform:uppercase;font-size:12px;letter-spacing:.1em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line);padding:6px 12px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brass2);color:#fff8e4}
.code{font:28px var(--mono);letter-spacing:.3em;color:var(--brass);background:#17130d;border:1px dashed var(--line);padding:6px 14px;border-radius:4px;user-select:text;-webkit-user-select:text}
.status{color:var(--dim);font-style:italic}
.status.ok{color:var(--green)} .status.bad{color:var(--red)}
.classes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1}
.cls{border:1px solid var(--line);border-radius:4px;padding:6px 8px;cursor:pointer;background:#1b160f;display:grid;grid-template-columns:56px 1fr;gap:8px;align-items:center}
.cls canvas{width:56px;height:56px}
.cls.on{border-color:var(--brass);background:#2c2415}
.cls b{display:block;letter-spacing:.08em}
.cls small{color:var(--dim);font-size:12px}
.cls.ro{cursor:default}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
.hint{color:var(--dim);font-size:12.5px;font-style:italic}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}

/* ---------- HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#top{position:absolute;top:0;left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding:8px 10px;pointer-events:none}
#top>*{pointer-events:auto}
#tl{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 10px;white-space:nowrap}
.chip small{color:var(--dim);text-transform:uppercase;font-size:10.5px;letter-spacing:.1em;margin-right:6px}
.chip.warn{border-color:var(--red);color:var(--red)}
.chip button{padding:1px 8px;margin-left:6px;font-size:12px}
#tc{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 14px;min-width:300px;text-align:center}
#clock{font:20px var(--mono);letter-spacing:.08em}
#clock small{font:11px var(--serif);color:var(--dim);text-transform:uppercase;letter-spacing:.14em;margin-right:8px}
#kingbar{position:relative;height:13px;background:#2b1512;border:1px solid var(--line);border-radius:2px;margin-top:4px;overflow:hidden}
#kingbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#f0e6cc,#c9bd9c);width:100%}
#kingbar span{position:absolute;inset:0;font:10px/12px var(--mono);color:#1a1510;text-align:center;mix-blend-mode:difference;color:#fff}
#guard{font-size:11px;color:var(--dim);margin-top:2px;letter-spacing:.06em}
#tr{display:flex;gap:6px;justify-content:flex-end;align-items:center}
#tr button{padding:4px 10px}
#ping{color:var(--dim);font:11px var(--mono)}
#toasts{position:absolute;top:92px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--brass);padding:5px 14px;border-radius:3px;animation:tin .2s ease-out;max-width:70vw}
.toast.bad{border-left-color:var(--red)} .toast.good{border-left-color:var(--green)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
#mini{position:absolute;left:10px;bottom:10px;width:176px;height:176px;border:1px solid var(--line);border-radius:4px;background:#0b0a08;cursor:crosshair}
#doctrine{position:absolute;top:92px;right:10px;width:250px;display:flex;flex-direction:column;gap:6px}
#doctrine h3{font-size:12px;color:var(--brass);background:var(--panel);border:1px solid var(--brass);padding:5px 10px;border-radius:3px}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:7px 10px;cursor:pointer}
.doc:hover{border-color:var(--brass);background:#2c2415}
.doc b{display:block;letter-spacing:.06em} .doc small{color:var(--dim)}
#docs{position:absolute;top:50px;right:10px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:360px;pointer-events:none}
#docs span{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1px 8px;font-size:11px;color:var(--brass)}

#archbar{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px}
.bb{position:relative;width:62px;height:66px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:#1b160f}
.bb canvas{width:38px;height:38px;position:absolute;top:2px}
.bb .k{position:absolute;top:1px;left:4px;font:10px var(--mono);color:var(--dim)}
.bb .c{font:11px var(--mono);color:var(--brass);margin-bottom:3px}
.bb.on{border-color:var(--brass);background:#3a2f18;box-shadow:0 0 0 1px var(--brass) inset}
.bb.cant .c{color:var(--red)}
#sel{position:absolute;right:10px;bottom:10px;width:250px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:10px 12px}
#sel h3{font-size:14px;color:var(--brass)}
#sel p{margin:4px 0;color:var(--dim);font-size:12.5px}
#sel .btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
#sel .btns button{padding:4px 9px;font-size:12.5px}
.bar{height:8px;background:#2b1512;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
#tip{position:absolute;max-width:280px;background:var(--panel);border:1px solid var(--brass);border-radius:4px;padding:8px 10px;pointer-events:none!important;font-size:13px;z-index:5}
#tip b{color:var(--brass);letter-spacing:.06em} #tip small{color:var(--dim);display:block;margin-top:3px}

#raidbar{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:8px 12px}
#rbPort{width:56px;height:56px;align-self:center;margin:-4px -2px -4px -4px}
#rb-vitals{width:240px}
#rb-vitals .nm{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
#hpbar{height:16px;position:relative;margin:3px 0} #hpbar i{background:linear-gradient(#e46a55,#a8301f)}
#hpbar span{position:absolute;inset:0;font:11px/15px var(--mono);text-align:center;text-shadow:0 1px 1px #000}
#xpbar{height:5px} #xpbar i{background:var(--blue)}
#rb-wpn{min-width:150px;white-space:nowrap;text-align:center;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:0 12px}
#rb-wpn .mag{font:22px var(--mono)} #rb-wpn .mag small{font-size:12px;color:var(--dim)}
#rb-wpn .wn{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
#rb-abil{display:flex;gap:6px}
.ab{position:relative;width:54px;height:54px;border:1px solid var(--line);border-radius:4px;background:#1b160f;text-align:center;overflow:hidden;cursor:default}
.ab .key{position:absolute;top:1px;left:4px;font:11px var(--mono);color:var(--brass)}
.ab .nm{position:absolute;bottom:9px;left:0;right:0;font-size:9.5px;line-height:1;color:var(--dim)}
.ab .cdv{position:absolute;inset:0;background:rgba(0,0,0,.72);font:18px/52px var(--mono);color:#fff}
.ab .pips{position:absolute;bottom:2px;left:0;right:0;font-size:7px;letter-spacing:2px;color:var(--brass);line-height:1}
.ab .up{position:absolute;top:-1px;right:-1px;padding:0 5px;font-size:12px;line-height:16px;background:var(--brass2);border-color:var(--brass);animation:pulse 1s infinite}
.ab.locked{opacity:.45}
.ab .ic{font-size:20px;line-height:38px;margin-top:4px}
@keyframes pulse{50%{filter:brightness(1.5)}}
#rb-keys{font-size:11px;color:var(--dim);display:flex;flex-direction:column;justify-content:center;gap:2px;white-space:nowrap}
#rb-keys b{font-family:var(--mono);color:var(--brass);font-weight:normal}

/* ---------- shop / overlays */
#shop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(980px,96vw);max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--brass);border-radius:6px;padding:14px 18px;box-shadow:0 20px 60px rgba(0,0,0,.7)}
#shop header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
#shop header h2{font-size:18px;color:var(--brass)}
#shop .cols{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:14px}
#shop h3{font-size:12px;color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:6px}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 8px;border:1px solid var(--line);border-radius:3px;padding:6px 9px;margin-bottom:5px;cursor:pointer;background:#1b160f}
.it:hover{border-color:var(--brass);background:#2c2415}
.it{position:relative}
.it .wic{position:absolute;right:8px;bottom:6px;width:118px;height:33px;pointer-events:none;filter:brightness(1.75) contrast(1.05);background:rgba(233,223,198,.07);border-radius:3px}
.it[data-kind="weapon"] small{padding-right:126px;min-height:36px}
.it b{letter-spacing:.04em} .it small{grid-column:1/3;color:var(--dim);font-size:12px}
.it .pr{font-family:var(--mono);color:var(--brass)}
.it.cant{opacity:.5} .it.cant .pr{color:var(--red)}
.it.own{border-color:var(--green)} .it.own .pr{color:var(--green)}
.it.max{opacity:.55;cursor:default} .it.oos{opacity:.3;cursor:default;text-decoration:line-through}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#overlay .card{width:min(680px,100%)}
#overlay h2{font-size:22px;color:var(--brass);margin-bottom:8px}
#overlay table{width:100%;border-collapse:collapse;margin:10px 0}
#overlay td{padding:3px 6px;border-bottom:1px solid #2c2415} #overlay td:last-child{text-align:right;font-family:var(--mono)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:8px 0}
.keys b{font-family:var(--mono);color:var(--brass);font-weight:normal;white-space:nowrap}
#brief{position:absolute;left:50%;top:110px;transform:translateX(-50%);width:min(560px,92vw);background:var(--panel);border:1px solid var(--brass);border-radius:5px;padding:12px 16px}
#brief h3{font-size:14px;color:var(--brass)} #brief p{margin:5px 0;font-size:13px}
#dead{position:absolute;left:50%;top:150px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--red);border-radius:5px;padding:8px 18px;text-align:center;pointer-events:none!important}
#dead b{font:26px var(--mono);color:var(--red)}
body.raider canvas#cv{cursor:none}
body.raider.ui canvas#cv{cursor:default}
@media (max-width:900px){#shop .cols{grid-template-columns:1fr}.menu{grid-template-columns:1fr}#rb-keys{display:none}}
@media (prefers-reduced-motion:reduce){.toast,.ab .up{animation:none}}

</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hidden">
  <div id="top">
    <div id="tl"></div>
    <div id="tc"><div id="clock"></div><div id="kingbar"><i></i><span></span></div><div id="guard"></div></div>
    <div id="tr"><span id="ping"></span><button id="bHelp" title="Controls and rules">?</button><button id="bMenu" title="Menu (Esc)">&#9776;</button></div>
  </div>
  <div id="docs"></div>
  <div id="doctrine" class="hidden"></div>
  <div id="toasts"></div>
  <canvas id="mini" width="176" height="176"></canvas>
  <div id="archbar" class="hidden"></div>
  <div id="sel" class="hidden"></div>
  <div id="raidbar" class="hidden"></div>
  <div id="brief" class="hidden"></div>
  <div id="dead" class="hidden"></div>
  <div id="tip" class="hidden"></div>
</div>
<div id="shop" class="hidden"></div>
<div id="overlay" class="hidden"></div>
<div id="screens"></div>

/* ------------------------------------------------------------------ helpers */
function blocked(G, tx, ty) {

function genMap(G) {

    x: clamp(Math.round(cx + Math.cos(a) * 22), 3, W - 4) + 0.5,
    y: clamp(Math.round(cy + Math.sin(a) * 22), 3, H - 4) + 0.5 }));
  const far = (x, y) => hyp(x + 0.5 - (cx + 0.5), y + 0.5 - (cy + 0.5)) > 7.6 && G.camps.every(c => hyp(x + 0.5 - c.x, y + 0.5 - c.y) > 5.6);
  const rock = (x, y) => { if (x >= 0 && y >= 0 && x < W && y < H && far(x, y)) G.terrain[y * W + x] = 1; };
  for (let n = ri(16, 24); n--;) {                      // blobs
    let x = ri(1, W - 2), y = ri(1, H - 2);
    for (let k = ri(2, 8); k--;) { rock(x, y); const d = ORTHO[ri(0, 3)]; x += d[0]; y += d[1]; }
  }
  for (let n = ri(4, 7); n--;) {                        // ridges with gaps: chokepoints
    let x = ri(4, W - 5), y = ri(4, H - 5); const d = ALL8[ri(0, 7)];
    for (let k = ri(5, 11); k--;) { if (R() > 0.18) { rock(x, y); if (d[0] && d[1]) rock(x + d[0], y); } x += d[0]; y += d[1]; }
  }
  // connectivity: carve a path if a camp is sealed off
  const seen = new Uint8Array(W * H), q = [cy * W + cx]; seen[q[0]] = 1;
  while (q.length) { const i = q.pop(), x = i % W, y = (i / W) | 0;
    for (const d of ORTHO) { const nx = x + d[0], ny = y + d[1]; if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const ni = ny * W + nx; if (seen[ni] || G.terrain[ni]) continue; seen[ni] = 1; q.push(ni); } }
  for (const c of G.camps) if (!seen[(c.y | 0) * W + (c.x | 0)]) {
    const n = 60; for (let k = 0; k <= n; k++) { const x = Math.round(c.x - 0.5 + (cx - c.x + 0.5) * k / n), y = Math.round(c.y - 0.5 + (cy - c.y + 0.5) * k / n);
      G.terrain[y * W + x] = 0; if (x + 1 < W) G.terrain[y * W + x + 1] = 0; }
  }
  // ore
  const rich = G.mod.id === 'rich' ? 1.6 : 1;
  const rings = [[4.2, 6, 2, 1], [9, 14, 3, 1.25], [15, 21, 3, 1.6]];
  for (const [r0, r1, cnt, mult] of rings) for (let n = 0; n < cnt; n++) {
    for (let tries = 0; tries < 30; tries++) {
      const a = R() * TAU, r = r0 + R() * (r1 - r0);
      let x = Math.round(cx + Math.cos(a) * r), y = Math.round(cy + Math.sin(a) * r);
      if (x < 2 || y < 2 || x >= W - 2 || y >= H - 2 || G.terrain[y * W + x]) continue;
      if (G.camps.some(c => hyp(x - c.x, y - c.y) < 6)) continue;
      let placed = 0;
      for (let k = ri(6, 10), guard = 40; k > 0 && guard--;) {
        const ok = x >= 1 && y >= 1 && x < W - 1 && y < H - 1 && !G.terrain[y * W + x] && Math.max(Math.abs(x - cx), Math.abs(y - cy)) > 2;
        if (ok && !G.ore[y * W + x]) { G.ore[y * W + x] = Math.round(ri(240, 400) * mult * rich); k--; placed++; }
        const d = ORTHO[ri(0, 3)]; if (ok || R() < 0.5) { x += d[0]; y += d[1]; } else { x -= d[0]; y -= d[1]; }
      }
      if (placed) break;
    }
  }
}

/* ------------------------------------------------------------------ host loop */
function pump() {
  if (A.screen !== 'game' || !A.isHost || !A.S) return;
  const S = A.S, now = performance.now(); A.acc += Math.min(0.25, (now - A.last) / 1000); A.last = now;
  while (A.acc >= DT) { A.acc -= DT; A.tick++;
    if (S.phase !== 'over' && !A.paused) {
      if (A.bot) { if (A.bot.role === 'A') { if ((A.bot.t -= DT) <= 0) { A.bot.t = 0.4; for (const c of Bots.archBot(S, A.bot.st)) RR.command(S, 'A', c); } } else for (const c of Bots.raidBot(S, A.bot.st, DT)) RR.command(S, 'R', c); }
      if (A.role === 'R') RR.command(S, 'R', inputState());
      RR.step(S, DT);
    }
    if (S.fx.length) { const fx = S.fx; S.fx = []; localFx(fx); if (A.conn && A.conn.up) for (const f of fx) A.outFx.push(f); }
    if (A.tick % 4 === 0 && A.conn && A.conn.up && A.guestIn) { const o = RR.snapshot(S, A.snapState); o.fx = A.outFx; A.outFx = []; A.conn.send(o); }
  }
}
function inputState() {
  const k = A.keys, typing = A.menuOpen; let mx = 0, my = 0;
  if (!typing) { mx = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0); my = (k.KeyS || k.ArrowDown ? 1 : 0) - (k.KeyW || k.ArrowUp ? 1 : 0); }
  const hp = R.heroPos(); A.aim = Math.atan2(A.mouse.wy - hp.y, A.mouse.wx - hp.x);
  return {c: 'in', mx, my, ang: Math.round(A.aim * 1000) / 1000, fire: A.mouse.down && !A.shop && !A.menuOpen};
}

/* ------------------------------------------------------------------ per-frame */
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - lastF) / 1000); lastF = now;
  if (A.screen === 'game' && A.S) {
    pump();
    const S = A.S, cam = A.cam, ms = A.mouse, k = A.keys;
    if (A.role === 'A') {
      if (!A.menuOpen) { const sp = 620 / cam.z * dt; cam.x += ((k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0)) * sp; cam.y += ((k.KeyS || k.ArrowDown ? 1 : 0) - (k.KeyW || k.ArrowUp ? 1 : 0)) * sp; }
      cam.x = RR.clamp(cam.x, -2, W + 2); cam.y = RR.clamp(cam.y, -2, H + 2);
    } else {
      const h = S.hero;
      if (!A.isHost) {                               // guest raider: predict own movement, send input ~30 Hz
        const inp = inputState();
        if (h.alive && A.pred) { let mx = inp.mx, my = inp.my; const l = hyp(mx, my); if (l > 1) { mx /= l; my /= l; } const sp = h.st.speed * (h.slowT > 0 ? 0.7 : 1) * (h.cloak > 0 ? 1.25 : 1);
          if (!h.dash && (mx || my)) RR.moveCircle(S, A.pred, mx * sp * dt, my * sp * dt, 0.35);
          if (S.phase === 'prep') { const c = S.camps[S.raid.lane === 1 ? 1 : 0], dd = hyp(A.pred.x - c.x, A.pred.y - c.y); if (dd > 5) { A.pred.x = c.x + (A.pred.x - c.x) * 5 / dd; A.pred.y = c.y + (A.pred.y - c.y) * 5 / dd; } } }
        if ((sendT -= dt) <= 0) { sendT = 0.033; if (A.conn && A.conn.up) A.conn.send({t: 'c', c: inp}); }
      }
      const hp = R.heroPos(); cam.z = RR.clamp(A.ch / 19, 22, 56) * cam.uz;
      const lx = ms.in ? (ms.x - A.cw / 2) / cam.z * 0.22 : 0, ly = ms.in ? (ms.y - A.ch / 2) / cam.z * 0.22 : 0;
      const tx = hp.x + lx, ty = hp.y + ly, kf = Math.min(1, dt * 12); cam.x += (tx - cam.x) * kf; cam.y += (ty - cam.y) * kf;
    }
    ms.wx = (ms.x - A.cw / 2) / cam.z + cam.x; ms.wy = (ms.y - A.ch / 2) / cam.z + cam.y;
    const tx = Math.floor(ms.wx), ty = Math.floor(ms.wy); A.hoverId = (tx >= 0 && ty >= 0 && tx < W && ty < H && ms.in) ? S.sgrid[ty * W + tx] : 0;
    if ((A.fogT -= dt) <= 0) { A.fogT = 0.1; const hp = R.heroPos(); R.updateFog(S, hp.x, hp.y); }
    if ((hudT -= dt) <= 0) { hudT = 0.12; hud(); R.mini(); }
  }
  R.draw(dt, now);
}

    } else panDrag = {x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false, btn: e.button}; });

      else if (code === 'Space') { A.cam.x = A.S.core.tx + 0.5; A.cam.y = A.S.core.ty + 0.5; }
    } else {
      const ms = A.mouse;
      if (code === 'KeyQ' || code === 'KeyE' || code === 'KeyX') { const k = code === 'KeyQ' ? 'q' : code === 'KeyE' ? 'e' : 'x', h = A.S.hero; if (!h.alive || A.S.phase !== 'live') return; if (!h.ranks[k]) { toast('Not learned yet. Spend a skill point with ' + ('qex'.indexOf(k) + 1) + '.', 'bad'); return; } if (h.cd[k] > 0) { C.Audio.play('err'); return; } order({c: 'cast', k, ax: ms.wx, ay: ms.wy}, true); }
      else if (code === 'KeyR') order({c: 'reload'}, true);
      else if (code === 'Digit1' || code === 'Digit2' || code === 'Digit3') order({c: 'rank', k: 'qex'[+code.slice(5) - 1]});
      else if (code === 'KeyB') openShop(!A.shop);
      else if (code === 'KeyT') order({c: 'recall'}, true);
      else if (code === 'KeyZ') order({c: 'lane', v: (A.S.raid.lane + 1) % 3}, true);
    }
  });
  // HUD delegation
  $('archbar').addEventListener('click', e => { const b = e.target.closest('.bb'); if (!b) return; const t = b.dataset.t; A.build = A.build === t ? null : t; A.moveMode = false; A.sel = 0; });
  $('sel').addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && !b.disabled) selAction(b.dataset.a); });
  $('doctrine').addEventListener('click', e => { const d = e.target.closest('.doc'); if (d) order({c: 'doctrine', i: +d.dataset.i}); });
  $('shop').addEventListener('click', e => { const it = e.target.closest('.it'), ln = e.target.closest('#shLane button'), cl = e.target.closest('[data-c]');
    if (ln) order({c: 'lane', v: +ln.dataset.v}); else if (cl) order({c: 'class', v: cl.dataset.c});
    else if (it && !/oos|max|own/.test(it.className)) { if (/cant/.test(it.className)) { C.Audio.play('err'); return; } order({c: 'buy', kind: it.dataset.kind, id: it.dataset.id}); }
    setTimeout(() => { if (A.shop) shopRefresh(); }, 80); });
  $('bMenu').onclick = () => gameMenu(); $('bHelp').onclick = () => help(A.role);
  $('mini').addEventListener('mousedown', e => { if (A.role !== 'A' || !A.S) return; const r = e.target.getBoundingClientRect(); A.cam.x = (e.clientX - r.left) / r.width * W; A.cam.y = (e.clientY - r.top) / r.height * H; });
  // tooltips
  const tip = $('tip');
  document.addEventListener('mousemove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (!el || A.screen !== 'game') { show(tip, false); return; }
    tip.innerHTML = el.dataset.tip; show(tip, true); const r = tip.getBoundingClientRect(); let x = e.clientX + 14, y = e.clientY - r.height - 12; if (x + r.width > innerWidth - 6) x = innerWidth - r.width - 6; if (y < 6) y = e.clientY + 18; tip.style.left = x + 'px'; tip.style.top = y + 'px'; });
}

/* ------------------------------------------------------------------ boot */
function boot() {
  R.init(); bindInput(); menu();
  try { const w = new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(0)},25)'], {type: 'text/javascript'}))); w.onmessage = pump; } catch (e) { setInterval(pump, 25); }
  requestAnimationFrame(frame);
  window.addEventListener('beforeunload', () => { if (A.conn) A.conn.close(); });
}
C.debug = {startRound, order, menu, lobby};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
